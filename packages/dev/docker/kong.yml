_format_version: "2.1"
_transform: true

###
# Routes the public API gateway (kong) to the right Supabase service.
# Mirrors supabase/docker/volumes/api/kong.yml structure.
###

services:
  - name: auth-verify
    url: http://gotrue:9999/verify
    routes:
      - name: auth-verify
        strip_path: true
        paths:
          - /verify
    plugins:
      - name: cors

  - name: auth-v1-open
    url: http://gotrue:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors

  - name: auth-v1-open-callback
    url: http://gotrue:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors

  - name: auth-v1-open-authorize
    url: http://gotrue:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors

  - name: auth-v1
    url: http://gotrue:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  # SAML SSO endpoints at the path GoTrue self-declares. GoTrue builds its SP
  # entityID and ACS URL from API_EXTERNAL_URL (no /auth/v1 prefix here) and
  # validates each assertion's Destination against that exact URL — so the
  # un-prefixed /sso/ path must route, and it is the canonical one to give an
  # IdP. Public by design: the IdP posts assertions directly to the ACS.
  - name: auth-v1-sso
    url: http://gotrue:9999/sso/
    routes:
      - name: auth-v1-sso
        strip_path: true
        paths:
          - /sso/
    plugins:
      - name: cors

  - name: rest-v1
    url: http://postgrest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  - name: realtime-v1-ws
    url: http://realtime-dev:4000/socket
    protocol: ws
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/

  - name: realtime-v1-rest
    url: http://realtime:4000/api
    routes:
      - name: realtime-v1-rest
        strip_path: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: cors

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  - name: functions-v1
    url: http://edge-runtime:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors

  - name: meta
    url: http://meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: cors
