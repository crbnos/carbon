    load_assignment:
      cluster_name: storage
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: ${STORAGE_HOST}  # carbon: the shared or the private Storage
                    port_value: 5000
    ignore_health_on_host_removal: true
    health_checks:
      - timeout: 2s
        interval: 5s
        unhealthy_threshold: 3
        healthy_threshold: 2
