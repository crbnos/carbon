###
# The worktree's own containers: GoTrue, PostgREST, Realtime, the API gateway
# and Inngest, plus Studio, Postgres-Meta and the edge runtime on demand.
# COMPOSE_PROJECT_NAME=carbon-<slug> namespaces every container, network, volume.
#
# Shared mode (the default): Postgres, PgBouncer, Storage, imgproxy and Inbucket
# are the shared containers on the `carbon-shared` network
# (docker-compose.shared.yml), and DB_HOST/DB_NAME point at this worktree's
# database there. `crbn up --isolated` adds docker-compose.isolated.yml, which
# starts those 5 services inside this project instead, as before.
#
# Required env (written by crbn to .env.local): PORT_*, DB_HOST, DB_NAME,
# STORAGE_HOST, STORAGE_TENANT, SMTP_HOST, SLOT_NAME_SUFFIX, SUPABASE_JWT_SECRET,
# SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, plus user secrets passed through.
#
# Redis is shared across worktrees — booted directly as the `carbon-redis`
# container by the dev CLI (packages/dev/src/services/compose.ts), not here.
###

# `restart: on-failure` on every service: a crashed container comes back, but
# the stack does NOT restart with the Docker daemon. A stack is only useful
# with its `crbn up` running, and `unless-stopped` brought every stack whose
# terminal had died back to life on each Docker start.
services:
  gotrue:
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    restart: on-failure
    # On carbon-shared every worktree's gotrue answers to "gotrue", so
    # Envoy reaches it by this alias, which only this project has.
    networks:
      default:
        aliases:
          - local-gotrue
      carbon-shared: {}
    deploy:
      resources:
        limits:
          memory: ${MEM_GOTRUE:-96m}
          cpus: ${CPU_GOTRUE:-0.25}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@${DB_HOST}:5432/${DB_NAME}
      GOTRUE_SITE_URL: ${ERP_URL}
      # `/**` so a callback carrying `?redirectTo=` still matches — an exact
      # entry does not, and GoTrue then falls back to GOTRUE_SITE_URL (the
      # ERP). localhost:4000 is the starter (`pnpm dev:starter`).
      GOTRUE_URI_ALLOW_LIST: ${ERP_URL},${ERP_URL}/**,${MES_URL},${MES_URL}/**,${GTM_URL},http://localhost:4000,http://localhost:4000/**
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-${SMTP_HOST}}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-2500}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-admin@carbon.local}
      GOTRUE_SMTP_SENDER_NAME: Carbon
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_AUTH_EXTERNAL_GOOGLE_REDIRECT_URI}
      GOTRUE_EXTERNAL_AZURE_ENABLED: "true"
      GOTRUE_EXTERNAL_AZURE_CLIENT_ID: ${SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_AZURE_SECRET: ${SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_AZURE_REDIRECT_URI: ${SUPABASE_AUTH_EXTERNAL_AZURE_REDIRECT_URI}
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ${ERP_URL}/templates/magic-link.html
      GOTRUE_MAILER_TEMPLATES_INVITE: ${ERP_URL}/templates/invite.html
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: 10
      GOTRUE_SAML_ENABLED: ${SAML_ENABLED:-false}
      GOTRUE_SAML_PRIVATE_KEY: ${SAML_PRIVATE_KEY:-}
      SSL_CERT_FILE: /etc/ssl/certs/portless-ca.pem
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${DOMAIN}:host-gateway"
    volumes:
      - ${PORTLESS_CA_FILE:-${HOME}/.portless/ca.pem}:/etc/ssl/certs/portless-ca.pem:ro

  postgrest:
    image: postgrest/postgrest:v13.0.8@sha256:d09618df2b7b9547c80a076c2f4045b326be8d7ac06060d263caefec1334e3c9
    restart: on-failure
    # On carbon-shared every worktree's postgrest answers to "postgrest", so
    # Envoy reaches it by this alias, which only this project has.
    networks:
      default:
        aliases:
          - local-postgrest
      carbon-shared: {}
    deploy:
      resources:
        limits:
          memory: ${MEM_POSTGREST:-256m}
          cpus: ${CPU_POSTGREST:-1}
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@${DB_HOST}:5432/${DB_NAME}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      # Pool default is 10 — a burst of concurrent authed queries (the /x loader
      # alone fires ~16) plus any aborted-mid-transaction requests exhausts it and
      # every subsequent query blocks. Bigger pool + a bounded acquisition timeout
      # so a saturated pool fails fast instead of hanging the request forever.
      PGRST_DB_POOL: ${PGRST_DB_POOL:-25}
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: ${PGRST_DB_POOL_ACQUISITION_TIMEOUT:-10}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      # Hosted values (config.toml [api]): a read returns at most 1000 rows,
      # and unqualified extension functions resolve.
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  realtime:
    image: supabase/realtime:v2.148.3@sha256:25cf375b9b7cb71d90cdf6e04a1a30996e39a8df866ebd0525bba1d959edc8d6
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: ${MEM_REALTIME:-384m}
          cpus: ${CPU_REALTIME:-0.5}
    networks:
      default:
        aliases:
          - realtime-dev
      carbon-shared: {}
    environment:
      PORT: 4000
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: postgres
      DB_NAME: ${DB_NAME}
      # Slot names are unique per cluster. In shared mode every worktree's
      # Realtime uses the shared Postgres, so each gets its own suffix.
      SLOT_NAME_SUFFIX: ${SLOT_NAME_SUFFIX:-}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      METRICS_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      APP_NAME: realtime
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  meta:
    image: supabase/postgres-meta:v0.100.0@sha256:145325b7e39f8ef4931d6e8cfd3f6f4d655de09d72a2ccc96d9513542c2202bd
    restart: on-failure
    # On carbon-shared every worktree's meta answers to "meta", so
    # Envoy reaches it by this alias, which only this project has.
    networks:
      default:
        aliases:
          - local-meta
      carbon-shared: {}
    deploy:
      resources:
        limits:
          memory: ${MEM_META:-128m}
          cpus: ${CPU_META:-0.25}
    profiles: ["full", "studio"]
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${DB_HOST}
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${DB_NAME}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: postgres

  studio:
    image: supabase/studio:2026.11.02-sha-a05e7ec@sha256:727a7f37b15f4c76c44e0d765e6be231d8d71c67f2933b2df8c6cbcc9b04c5d0
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: ${MEM_STUDIO:-384m}
          cpus: ${CPU_STUDIO:-0.5}
    profiles: ["full", "studio"]
    depends_on:
      meta:
        condition: service_started
    ports:
      - "${PORT_STUDIO}:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      # Studio sends postgres-meta the database to query, built from these.
      # Unset, it is db:5432/postgres, a host neither mode has.
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: postgres
      DEFAULT_ORGANIZATION_NAME: Carbon
      DEFAULT_PROJECT_NAME: carbon-${CARBON_WORKTREE}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Studio's SQL-editor snippets are read from a directory on disk; with the
      # var unset it throws "SNIPPETS_MANAGEMENT_FOLDER env var is not set" on
      # the SQL editor page. Studio creates the folder itself if missing. Not a
      # mounted volume on purpose — snippets are scratch SQL, not project state.
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets

  # This worktree's own runtime, serving its checkout's functions: for editing
  # them. Without it (the default) Envoy sends /functions/v1/ to crbn-shared's
  # carbon-edge-runtime, which serves the functions crbn last copied.
  edge-runtime:
    image: supabase/edge-runtime:v1.77.9@sha256:6b850a2ccf0bf50ecac9accff8098095cd191c389c2a53c59b857aa0f53a8343
    restart: on-failure
    profiles: ["full"]
    # Envoy reaches it by this alias: on carbon-shared, the bare name
    # "edge-runtime" is crbn-shared's service.
    networks:
      default:
        aliases:
          - local-edge-runtime
    deploy:
      resources:
        limits:
          # The edge runtime compiles each function's TS module graph on worker
          # boot. Starved of CPU, worker boot outlives the isolate CPU budget
          # and requests hang mid-kill.
          memory: ${MEM_EDGE:-1g}
          cpus: ${CPU_EDGE:-3}
    environment:
      TZ: UTC
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      VERIFY_JWT: "false"
    volumes:
      - ./packages/database/supabase/functions:/home/deno/functions:ro
      # Dev-only dispatcher; lives outside supabase/functions/ so prod
      # `supabase functions deploy --all` can't pick it up.
      - ./packages/dev/docker/edge-main:/home/deno/main:ro
    command:
      - start
      - --main-service
      - /home/deno/main

  # The API gateway: Envoy, as on the hosted platform and upstream self-hosting.
  # Config is vendored from upstream (packages/dev/docker/envoy). The `kong`
  # alias keeps internal URLs (http://kong:8000 in the config row, Studio, the
  # edge runtime) working.
  api-gw:
    image: envoyproxy/envoy:v1.39.6@sha256:1fde8efee875e4e4f6a39a90fe49d9338e1caacce5762034ef9fb4bbb9ad6aed
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: ${MEM_API_GW:-256m}
          cpus: ${CPU_API_GW:-0.5}
    networks:
      default:
        aliases:
          - kong
          - envoy
      # pg_net requests from the shared Postgres reach this gateway here.
      carbon-shared:
        aliases:
          - ${CARBON_WORKTREE}-api-gw
    depends_on:
      gotrue:
        condition: service_started
      postgrest:
        condition: service_started
      realtime:
        condition: service_started
      meta:
        condition: service_started
        required: false
      edge-runtime:
        condition: service_started
        required: false
    ports:
      - "${PORT_API}:8000"
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL}
      # Guards the gateway's `/` route to Studio. Studio has its own port
      # here (PORT_STUDIO), so nothing uses this route.
      DASHBOARD_USERNAME: supabase
      DASHBOARD_PASSWORD: postgres
      # The shared or the private Storage, and this worktree's tenant in it.
      STORAGE_HOST: ${STORAGE_HOST}
      STORAGE_TENANT: ${STORAGE_TENANT}
      STORAGE_PUBLIC_HOST: ${STORAGE_PUBLIC_HOST}
      STORAGE_PUBLIC_PROTO: ${STORAGE_PUBLIC_PROTO}
      STORAGE_PUBLIC_PORT: ${STORAGE_PUBLIC_PORT}
      # This gateway on carbon-shared, sent to the shared edge runtime.
      FUNCTIONS_API_URL: http://${CARBON_WORKTREE}-api-gw:8000
    volumes:
      - ./packages/dev/docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./packages/dev/docker/envoy/cds.template.yaml:/etc/envoy/cds.template.yaml:ro
      - ./packages/dev/docker/envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./packages/dev/docker/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro

  inngest:
    image: inngest/inngest:v1.19.4@sha256:d53a2edc9f1d5d9185fdb3a36f840a81533c19ba67109aed3a1b852f2db838d6
    restart: on-failure
    networks:
      default: {}
      # The shared Postgres sends this worktree's events here.
      carbon-shared:
        aliases:
          - ${CARBON_WORKTREE}-inngest
    deploy:
      resources:
        limits:
          memory: ${MEM_INNGEST:-1g}
          cpus: ${CPU_INNGEST:-0.5}
    ports:
      - "${PORT_INNGEST}:8288"
    command:
      - inngest
      - dev
      - --sdk-url=${ERP_URL}/api/inngest
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/portless-ca.pem
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${INNGEST_TLS_HOST}:host-gateway"
    volumes:
      - inngest:/data
      - ${PORTLESS_CA_FILE:-${HOME}/.portless/ca.pem}:/etc/ssl/certs/portless-ca.pem:ro

networks:
  carbon-shared:
    name: carbon-shared
    external: true

volumes:
  inngest:
