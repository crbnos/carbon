    <g stroke="#f0f3f5" stroke-width="2" opacity="0.5" fill="none">
      <path d="M812 505 L846 497"/><path d="M812 519 L846 511"/>
      <path d="M812 533 L846 525"/><path d="M812 547 L846 539"/>
    </g>
  </g>

  <!-- rod clevis eye -->
  <g>
    <path d="M840 478 L862 470 L862 570 L840 562 Z" fill="url(#steel)" stroke="#4b5156" stroke-width="2.5"/>
    <circle cx="862" cy="520" r="50" fill="url(#steelFace)" stroke="#4b5156" stroke-width="2.5"/>
    <circle cx="862" cy="520" r="41" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>
    <circle cx="862" cy="520" r="26" fill="#2f353a" stroke="#5c6368" stroke-width="2.5"/>
    <circle cx="862" cy="520" r="20" fill="#171b1e"/>
    <path d="M846 506 Q862 498 878 506" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>
    <path d="M828 486 Q818 520 828 554" fill="none" stroke="#3f454a" stroke-opacity="0.45" stroke-width="4"/>
  </g>
