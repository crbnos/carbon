  <!-- male thread onto the rod eye -->
  <g>
    <rect x="812" y="486" width="34" height="68" fill="url(#steel)" stroke="#4b5156" stroke-width="2.5"/>
    <g stroke="#5f666b" stroke-width="3.5" opacity="0.8" fill="none">
      <path d="M812 498 L846 490"/><path d="M812 512 L846 504"/>
      <path d="M812 526 L846 518"/><path d="M812 540 L846 532"/>
