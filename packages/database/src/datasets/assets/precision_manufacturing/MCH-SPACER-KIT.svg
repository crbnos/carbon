    <ellipse cx="769" cy="552" rx="27" ry="78" fill="url(#ssFace)" stroke="#4a5055" stroke-width="3"/>
    <ellipse cx="769" cy="552" rx="23" ry="70" fill="none" stroke="#9aa2a8" stroke-width="2" opacity="0.9"/>
