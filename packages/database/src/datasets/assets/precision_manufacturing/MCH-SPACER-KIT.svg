  <!-- 5: lying, shortest (6mm) -->
  <g>
    <path d="M831 474 L870 474 A 27 78 0 0 1 870 630 L831 630 A 27 78 0 0 1 831 474 Z" fill="url(#ssRoll)" stroke="#4a5055" stroke-width="3"/>
