<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6167"/>
      <stop offset="0.14" stop-color="#dfe6ea"/>
      <stop offset="0.34" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#9aa2a9"/>
      <stop offset="1" stop-color="#4e5459"/>
    </linearGradient>
    <linearGradient id="chromeFace" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.14" stop-color="#dfe6ea"/>
      <stop offset="0.34" stop-color="#f6f9fa"/>
      <stop offset="0.6" stop-color="#9aa2a9"/>
      <stop offset="1" stop-color="#4e5459"/>
    </linearGradient>
    <linearGradient id="ssBarrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e747a"/>
      <stop offset="0.18" stop-color="#c3c9cd"/>
      <stop offset="0.42" stop-color="#eef1f3"/>
      <stop offset="0.7" stop-color="#aab1b7"/>
      <stop offset="1" stop-color="#5d6368"/>
    </linearGradient>
    <linearGradient id="ssFace" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#eef1f3"/>
      <stop offset="0.42" stop-color="#c3c9cd"/>
      <stop offset="1" stop-color="#5d6368"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4a2c"/>
      <stop offset="0.2" stop-color="#c08b52"/>
      <stop offset="0.45" stop-color="#e0b077"/>
      <stop offset="0.72" stop-color="#9a6f42"/>
      <stop offset="1" stop-color="#5d3f26"/>
    </linearGradient>
    <linearGradient id="bronzeFace" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#e0b077"/>
      <stop offset="0.45" stop-color="#c08b52"/>
      <stop offset="1" stop-color="#5d3f26"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="512" cy="830" rx="210" ry="46" fill="url(#shadow)"/>

  <!-- unplated ground journal (drawn behind the barrel and the bushing) -->
  <path d="M432 626 L432 790 Q512 851 592 790 L592 626 Z" fill="url(#ssBarrel)" stroke="#4a5055" stroke-width="2"/>
  <g fill="none" stroke="#6b7278" stroke-width="2" stroke-opacity="0.5">
    <path d="M436 690 L588 690"/>
    <path d="M436 716 L588 716"/>
  </g>

  <!-- mirror hard-chrome barrel -->
  <path d="M412 334 L412 616 Q512 692 612 616 L612 334 Z" fill="url(#chrome)" stroke="#43484d" stroke-width="3"/>
  <!-- reflected studio: a bright streak and a dark horizon band -->
  <path d="M448 340 L448 610 Q460 640 470 610 L470 340 Z" fill="#ffffff" opacity="0.55"/>
  <path d="M556 340 L556 606 Q566 634 574 606 L574 340 Z" fill="#2f353a" opacity="0.30"/>
  <path d="M412 452 L612 452 L612 486 L412 486 Z" fill="#3b4147" opacity="0.14"/>
  <path d="M412 500 L612 500 L612 512 L412 512 Z" fill="#ffffff" opacity="0.28"/>
  <!-- ground-surface sheen lines -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2">
    <path d="M424 380 L424 604"/>
    <path d="M596 380 L596 600"/>
  </g>
  <!-- shoulder shading where the barrel steps down to the journal -->
  <path d="M412 600 Q512 676 612 600" fill="none" stroke="#41474c" stroke-width="4" opacity="0.55"/>

  <!-- narrow relief undercut at the thread runout -->
  <path d="M454 296 L454 318 L570 318 L570 296 Z" fill="#6f767c"/>
  <path d="M454 300 L570 300" stroke="#41474c" stroke-width="3" fill="none"/>
  <path d="M454 314 L570 314" stroke="#41474c" stroke-width="3" fill="none"/>
  <!-- crisp chamfer flaring onto the full diameter -->
  <path d="M454 318 L412 336 L612 336 L570 318 Z" fill="url(#chrome)" stroke="#43484d" stroke-width="2"/>
  <path d="M454 320 L570 320" stroke="#eef2f4" stroke-width="2" stroke-opacity="0.5" fill="none"/>

  <!-- fine male thread on the turned-down end -->
  <path d="M444 150 L444 296 L580 296 L580 150 Z" fill="url(#ssBarrel)" stroke="#4a5055" stroke-width="3"/>
  <g stroke="#7b8288" stroke-width="3.5" opacity="0.75" fill="none">
    <path d="M444 182 L580 158"/><path d="M444 200 L580 176"/>
    <path d="M444 218 L580 194"/><path d="M444 236 L580 212"/>
    <path d="M444 254 L580 230"/><path d="M444 272 L580 248"/>
    <path d="M444 290 L580 266"/>
  </g>
  <g stroke="#f2f5f6" stroke-width="2" opacity="0.5" fill="none">
    <path d="M444 191 L580 167"/><path d="M444 209 L580 185"/>
    <path d="M444 227 L580 203"/><path d="M444 245 L580 221"/>
    <path d="M444 263 L580 239"/><path d="M444 281 L580 257"/>
  </g>
  <!-- thread lead-in chamfer + end face -->
  <ellipse cx="512" cy="150" rx="68" ry="26" fill="url(#ssFace)" stroke="#4a5055" stroke-width="3"/>
  <ellipse cx="512" cy="150" rx="58" ry="22" fill="none" stroke="#9aa2a8" stroke-width="2" opacity="0.9"/>
  <ellipse cx="512" cy="150" rx="44" ry="17" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- bronze bushing slipped over the journal -->
  <path d="M396 716 L396 782 Q512 870 628 782 L628 716 Z" fill="url(#bronze)" stroke="#4a3222" stroke-width="3"/>
  <path d="M396 768 Q512 856 628 768" fill="none" stroke="#7c5836" stroke-width="3" opacity="0.7"/>
  <ellipse cx="512" cy="716" rx="116" ry="44" fill="url(#bronzeFace)" stroke="#4a3222" stroke-width="3"/>
  <ellipse cx="512" cy="716" rx="104" ry="39" fill="none" stroke="#e6bd8b" stroke-width="2" opacity="0.6"/>
  <ellipse cx="512" cy="716" rx="80" ry="30" fill="#5a6167" stroke="#3f4448" stroke-width="2"/>
  <ellipse cx="512" cy="719" rx="72" ry="27" fill="url(#ssFace)" opacity="0.85"/>
</svg>
