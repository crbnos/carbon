<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="crsFace" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4b4f52"/>
      <stop offset="0.22" stop-color="#787d81"/>
      <stop offset="0.45" stop-color="#8d9296"/>
      <stop offset="0.72" stop-color="#63686c"/>
      <stop offset="1" stop-color="#414548"/>
    </linearGradient>
    <linearGradient id="crsTop" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#787d81"/>
      <stop offset="0.22" stop-color="#8d9296"/>
      <stop offset="0.45" stop-color="#9aa0a4"/>
      <stop offset="0.72" stop-color="#787d81"/>
      <stop offset="1" stop-color="#4b4f52"/>
    </linearGradient>
    <linearGradient id="boreDepth" x1="0.15" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#3c4245"/>
      <stop offset="0.45" stop-color="#22262a"/>
      <stop offset="1" stop-color="#14171a"/>
    </linearGradient>
    <radialGradient id="oilFilm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="crsFrontClip">
      <polygon points="-400,-80 400,-80 400,80 -400,80"/>
    </clipPath>
    <clipPath id="crsTopClip">
      <polygon points="-400,-80 -332.8,-128 467.2,-128 400,-80"/>
    </clipPath>
    <clipPath id="crsEndClip">
      <polygon points="-400,-80 -332.8,-128 -332.8,32 -400,80"/>
    </clipPath>
  </defs>

  <g transform="translate(512 500) rotate(-24)">
    <ellipse cx="0" cy="132" rx="390" ry="86" fill="url(#shadow)"/>

    <!-- top face -->
    <polygon points="-400,-80 -332.8,-128 467.2,-128 400,-80" fill="url(#crsTop)" stroke="#33383b" stroke-width="3" stroke-linejoin="round"/>
    <g clip-path="url(#crsTopClip)">
      <rect x="-410" y="-132" width="890" height="20" fill="#ffffff" opacity="0.14"/>
      <ellipse cx="-60" cy="-104" rx="300" ry="26" fill="url(#oilFilm)"/>
      <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.6" fill="none">
        <path d="M-390 -92 L470 -92"/><path d="M-380 -104 L470 -104"/><path d="M-370 -118 L470 -118"/>
      </g>
      <g stroke="#2b2f32" stroke-opacity="0.16" stroke-width="1.4" fill="none">
        <path d="M-386 -98 L470 -98"/><path d="M-376 -111 L470 -111"/>
      </g>
      <!-- shallow handling scuffs -->
      <g stroke="#c2c8cb" stroke-opacity="0.30" stroke-width="2" fill="none">
        <path d="M60 -100 L128 -104"/><path d="M240 -116 L286 -118"/>
      </g>
    </g>

    <!-- front face -->
    <polygon points="-400,-80 400,-80 400,80 -400,80" fill="url(#crsFace)" stroke="#33383b" stroke-width="3" stroke-linejoin="round"/>
    <g clip-path="url(#crsFrontClip)">
      <rect x="-405" y="-85" width="810" height="170" fill="#262a2d" opacity="0.16"/>
      <!-- light film of oil: broad soft sheen -->
      <ellipse cx="-120" cy="-30" rx="330" ry="60" fill="url(#oilFilm)"/>
      <ellipse cx="250" cy="-42" rx="220" ry="42" fill="url(#oilFilm)"/>
      <!-- mill seam weld line -->
      <path d="M-400 -18 L400 -18" stroke="#1e2225" stroke-opacity="0.55" stroke-width="2.6" fill="none"/>
      <path d="M-400 -22 L400 -22" stroke="#b9bfc3" stroke-opacity="0.28" stroke-width="2" fill="none"/>
      <!-- radiused corner highlights -->
      <rect x="-405" y="-80" width="810" height="9" fill="#dfe4e7" opacity="0.30"/>
      <rect x="-405" y="66" width="810" height="14" fill="#1b1f22" opacity="0.34"/>
      <!-- fine directional cold-roll lines -->
      <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.6" fill="none">
        <path d="M-400 -56 L400 -56"/><path d="M-400 8 L400 8"/><path d="M-400 44 L400 44"/>
      </g>
      <g stroke="#1f2326" stroke-opacity="0.16" stroke-width="1.4" fill="none">
        <path d="M-400 -48 L400 -48"/><path d="M-400 18 L400 18"/><path d="M-400 54 L400 54"/>
      </g>
      <!-- shallow handling scuffs -->
      <g stroke="#cdd3d6" stroke-opacity="0.26" stroke-width="2.4" fill="none">
        <path d="M-190 26 L-96 20"/><path d="M96 -60 L150 -64"/><path d="M214 40 L268 36"/>
      </g>
      <g stroke="#1a1e21" stroke-opacity="0.24" stroke-width="1.8" fill="none">
        <path d="M-186 31 L-100 25"/><path d="M100 -55 L148 -59"/>
      </g>
    </g>

    <!-- sawn end face: square wall section -->
    <polygon points="-400,-80 -332.8,-128 -332.8,32 -400,80" fill="url(#crsFace)" stroke="#33383b" stroke-width="3" stroke-linejoin="round"/>
    <g clip-path="url(#crsEndClip)">
      <polygon points="-400,-80 -332.8,-128 -332.8,32 -400,80" fill="#ffffff" opacity="0.18"/>
      <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.6" fill="none">
        <path d="M-398 -70 L-334 -118"/><path d="M-398 -40 L-334 -88"/><path d="M-398 -10 L-334 -58"/>
        <path d="M-398 20 L-334 -28"/><path d="M-398 50 L-334 2"/>
      </g>
      <g stroke="#2b3033" stroke-opacity="0.28" stroke-width="1.3" fill="none">
        <path d="M-398 -55 L-334 -103"/><path d="M-398 -25 L-334 -73"/><path d="M-398 5 L-334 -43"/><path d="M-398 35 L-334 -13"/>
      </g>
    </g>

    <!-- open bore -->
    <polygon points="-393.3,-68.8 -339.5,-107.2 -339.5,20.8 -393.3,59.2" fill="url(#boreDepth)" stroke="#171b1e" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- inner walls receding along the axis -->
    <polygon points="-393.3,-68.8 -339.5,-107.2 -300,-107.2 -354,-68.8" fill="#464c50" opacity="0.55"/>
    <polygon points="-393.3,59.2 -339.5,20.8 -300,20.8 -354,59.2" fill="#0f1214" opacity="0.6"/>
    <!-- light burr inside the bore -->
    <g fill="none" stroke="#aeb4b8" stroke-opacity="0.45" stroke-width="2">
      <path d="M-391 -63 L-342 -98"/>
      <path d="M-391 54 L-342 16"/>
    </g>
    <!-- rim break on the sawn edge -->
    <polygon points="-397,-75.1 -335.8,-118.9 -335.8,27.1 -397,70.9" fill="none" stroke="#d3d8db" stroke-opacity="0.28" stroke-width="2"/>
  </g>
</svg>
