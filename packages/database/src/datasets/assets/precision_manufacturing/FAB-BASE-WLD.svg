      <polygon points="409.3,432.2 463.1,432.2 463.1,498.2 409.3,498.2" fill="url(#enamelSide)"/>
      <polygon points="463.1,432.2 485.8,416 485.8,482 463.1,498.2" fill="url(#enamelSide)"/>
      <polygon points="463.1,432.2 485.8,416 485.8,482 463.1,498.2" fill="#000" fill-opacity="0.3" stroke="none"/>
      <!-- back-right -->
      <polygon points="785.5,432.2 839.3,432.2 839.3,498.2 785.5,498.2" fill="url(#enamelSide)"/>
      <polygon points="839.3,432.2 862,416 862,482 839.3,498.2" fill="url(#enamelSide)"/>
      <polygon points="839.3,432.2 862,416 862,482 839.3,498.2" fill="#000" fill-opacity="0.3" stroke="none"/>
      <!-- front-left -->
      <polygon points="160,610 213.8,610 213.8,676 160,676" fill="url(#enamelSide)"/>
      <polygon points="213.8,610 236.4,593.8 236.4,659.8 213.8,676" fill="url(#enamelSide)"/>
      <polygon points="213.8,610 236.4,593.8 236.4,659.8 213.8,676" fill="#000" fill-opacity="0.3" stroke="none"/>
      <!-- front-right -->
