      <use href="#bead" transform="translate(310 439.5) scale(0.49 0.34)"/>
      <use href="#tint" transform="translate(376.4 439) rotate(-35.4) scale(0.29 0.34)"/>
      <use href="#bead" transform="translate(376.4 439) rotate(-35.4) scale(0.29 0.34)"/>
