      <polygon points="686.9,438.4 751.9,438.4 751.9,423.4 686.9,423.4" fill="url(#ssPadSide)" stroke="#4a5055" stroke-width="2.5"/>
      <polygon points="751.9,438.4 783.7,415.8 783.7,400.8 751.9,423.4" fill="url(#ssPadSide)" stroke="#4a5055" stroke-width="2.5"/>
      <polygon points="751.9,438.4 783.7,415.8 783.7,400.8 751.9,423.4" fill="#000" fill-opacity="0.22"/>
      <polygon points="686.9,423.4 751.9,423.4 783.7,400.8 718.7,400.8" fill="url(#ssPad)" stroke="#4a5055" stroke-width="2.5"/>
      <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.6">
        <path d="M693 419.4 L755 419.4"/><path d="M698 414.4 L760 414.4"/>
        <path d="M703 409.4 L765 409.4"/><path d="M708 404.4 L770 404.4"/>
      </g>
      <polygon points="692,420.8 749,420.8 776,402 721,402" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
      <g>
        <ellipse cx="726.2" cy="418.6" rx="17" ry="6.5" fill="#9ba2a8" stroke="#5b6167" stroke-width="2"/>
        <ellipse cx="726.2" cy="418.6" rx="11" ry="4.2" fill="#33383d"/>
        <ellipse cx="744.4" cy="405.6" rx="17" ry="6.5" fill="#9ba2a8" stroke="#5b6167" stroke-width="2"/>
        <ellipse cx="744.4" cy="405.6" rx="11" ry="4.2" fill="#33383d"/>
      </g>
      <use href="#tint" transform="translate(685 439.5) scale(0.5 0.34)"/>
      <use href="#bead" transform="translate(686 439.5) scale(0.49 0.34)"/>
      <use href="#tint" transform="translate(752.4 439) rotate(-35.4) scale(0.29 0.34)"/>
      <use href="#bead" transform="translate(752.4 439) rotate(-35.4) scale(0.29 0.34)"/>
    </g>
  </g>
</svg>
