      <use href="#tint" transform="translate(340 462) rotate(90) scale(0.44 0.44)"/>
      <use href="#bead" transform="translate(340 462) rotate(90) scale(0.44 0.44)"/>
      <use href="#tint" transform="translate(660.9 461.1) rotate(-36) scale(0.2 0.44)"/>
      <use href="#bead" transform="translate(660.9 461.1) rotate(-36) scale(0.2 0.44)"/>
      <use href="#tint" transform="translate(659.4 462) rotate(90) scale(0.44 0.44)"/>
      <use href="#bead" transform="translate(659.4 462) rotate(90) scale(0.44 0.44)"/>
