      <!-- drilled for large socket screws -->
      <g>
        <ellipse cx="350.2" cy="418.6" rx="17" ry="6.5" fill="#9ba2a8" stroke="#5b6167" stroke-width="2"/>
        <ellipse cx="350.2" cy="418.6" rx="11" ry="4.2" fill="#33383d"/>
        <ellipse cx="368.4" cy="405.6" rx="17" ry="6.5" fill="#9ba2a8" stroke="#5b6167" stroke-width="2"/>
        <ellipse cx="368.4" cy="405.6" rx="11" ry="4.2" fill="#33383d"/>
