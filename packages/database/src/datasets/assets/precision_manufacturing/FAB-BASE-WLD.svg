      <use href="#bead" transform="translate(160 550) rotate(-11.7) scale(0.58 0.42)"/>
      <use href="#tint" transform="translate(590 550) rotate(207.3) scale(0.26 0.42)"/>
      <use href="#bead" transform="translate(590 550) rotate(207.3) scale(0.26 0.42)"/>
      <use href="#tint" transform="translate(862 356) rotate(168.3) scale(0.58 0.42)"/>
      <use href="#bead" transform="translate(862 356) rotate(168.3) scale(0.58 0.42)"/>
      <use href="#tint" transform="translate(432 356) rotate(27.3) scale(0.26 0.42)"/>
      <use href="#bead" transform="translate(432 356) rotate(27.3) scale(0.26 0.42)"/>
