        <ellipse cx="16.6" cy="-1.8" rx="3" ry="2"/><ellipse cx="25.6" cy="-1.8" rx="3" ry="2"/>
        <ellipse cx="34.6" cy="-1.8" rx="3" ry="2"/><ellipse cx="43.6" cy="-1.8" rx="3" ry="2"/>
        <ellipse cx="52.6" cy="-1.8" rx="3" ry="2"/><ellipse cx="61.6" cy="-1.8" rx="3" ry="2"/>
        <ellipse cx="70.6" cy="-1.8" rx="3" ry="2"/><ellipse cx="79.6" cy="-1.8" rx="3" ry="2"/>
        <ellipse cx="88.6" cy="-1.8" rx="3" ry="2"/><ellipse cx="97.6" cy="-1.8" rx="3" ry="2"/>
        <ellipse cx="106.6" cy="-1.8" rx="3" ry="2"/><ellipse cx="115.6" cy="-1.8" rx="3" ry="2"/>
        <ellipse cx="124.6" cy="-1.8" rx="3" ry="2"/><ellipse cx="133.6" cy="-1.8" rx="3" ry="2"/>
