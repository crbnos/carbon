      <g fill="url(#weldG)" stroke="#565c62" stroke-width="1.2">
        <ellipse cx="0" cy="0" rx="6.6" ry="5.4"/><ellipse cx="9" cy="0" rx="6.6" ry="5.4"/>
        <ellipse cx="18" cy="0" rx="6.6" ry="5.4"/><ellipse cx="27" cy="0" rx="6.6" ry="5.4"/>
        <ellipse cx="36" cy="0" rx="6.6" ry="5.4"/><ellipse cx="45" cy="0" rx="6.6" ry="5.4"/>
        <ellipse cx="54" cy="0" rx="6.6" ry="5.4"/><ellipse cx="63" cy="0" rx="6.6" ry="5.4"/>
        <ellipse cx="72" cy="0" rx="6.6" ry="5.4"/><ellipse cx="81" cy="0" rx="6.6" ry="5.4"/>
        <ellipse cx="90" cy="0" rx="6.6" ry="5.4"/><ellipse cx="99" cy="0" rx="6.6" ry="5.4"/>
        <ellipse cx="108" cy="0" rx="6.6" ry="5.4"/><ellipse cx="117" cy="0" rx="6.6" ry="5.4"/>
        <ellipse cx="126" cy="0" rx="6.6" ry="5.4"/><ellipse cx="135" cy="0" rx="6.6" ry="5.4"/>
