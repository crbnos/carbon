    <polygon points="338.4,461.1 660.9,461.1 660.9,521.1 338.4,521.1" fill="#000" fill-opacity="0.16"/>
    <polygon points="338.4,461.1 660.9,461.1 683.6,444.9 361.1,444.9" fill="url(#enamel)" stroke="#15181a" stroke-width="2.5"/>
    <path d="M361.1 449.5 L679 449.5" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>

    <!-- ============ frame top face (ring) ============ -->
    <path d="M160 550 L590 550 L862 356 L432 356 Z M236.4 533.8 L558.9 533.8 L785.6 372.2 L463.1 372.2 Z"
          fill="url(#enamel)" fill-rule="evenodd" stroke="#15181a" stroke-width="2.5"/>
    <!-- semi-gloss sheen on the top rails -->
    <g stroke="#ffffff" stroke-opacity="0.13" stroke-width="5" fill="none">
