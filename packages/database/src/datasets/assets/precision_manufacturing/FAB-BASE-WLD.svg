      <polygon points="590,610 612.7,593.8 612.7,659.8 590,676" fill="url(#enamelSide)"/>
      <polygon points="590,610 612.7,593.8 612.7,659.8 590,676" fill="#000" fill-opacity="0.3" stroke="none"/>
    </g>
    <!-- leg-to-rail fillet beads -->
    <g>
      <use href="#tint" transform="translate(160 611) scale(0.4 0.5)"/>
      <use href="#bead" transform="translate(161 611) scale(0.39 0.5)"/>
      <use href="#tint" transform="translate(536.3 611) scale(0.4 0.5)"/>
      <use href="#bead" transform="translate(537.3 611) scale(0.39 0.5)"/>
      <use href="#tint" transform="translate(409.3 433.2) scale(0.4 0.5)"/>
      <use href="#bead" transform="translate(410.3 433.2) scale(0.39 0.5)"/>
      <use href="#tint" transform="translate(785.5 433.2) scale(0.4 0.5)"/>
      <use href="#bead" transform="translate(786.5 433.2) scale(0.39 0.5)"/>
    </g>

    <!-- ============ inner walls of the open frame ============ -->
    <polygon points="236.4,533.8 463.1,372.2 463.1,432.2 236.4,593.8" fill="url(#enamelSide)" stroke="#15181a" stroke-width="2.5"/>
    <polygon points="236.4,533.8 463.1,372.2 463.1,432.2 236.4,593.8" fill="#000" fill-opacity="0.42"/>
    <polygon points="463.1,372.2 785.6,372.2 785.6,432.2 463.1,432.2" fill="url(#enamelSide)" stroke="#15181a" stroke-width="2.5"/>
