      <stop offset="0" stop-color="#4e565c" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4e565c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sheetClip">
      <path d="M128 526 C318 552 518 562 728 558 L896 446 L296 446 Z"/>
    </clipPath>
  </defs>

  <ellipse cx="512" cy="508" rx="432" ry="95" fill="url(#shadow)"/>

