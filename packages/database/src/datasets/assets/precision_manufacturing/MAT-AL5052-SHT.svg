<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="alTop" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7d848a"/>
      <stop offset="0.2" stop-color="#ced5da"/>
      <stop offset="0.45" stop-color="#e8edf0"/>
      <stop offset="0.72" stop-color="#a9b1b7"/>
      <stop offset="1" stop-color="#6b7278"/>
    </linearGradient>
    <linearGradient id="alEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7bec4"/>
      <stop offset="0.5" stop-color="#7d848a"/>
      <stop offset="1" stop-color="#5c6367"/>
