<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bronzeFront" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2e2620"/>
      <stop offset="0.2" stop-color="#5c4c3d"/>
      <stop offset="0.45" stop-color="#7a6650"/>
      <stop offset="0.72" stop-color="#4a3d31"/>
      <stop offset="1" stop-color="#241d18"/>
    </linearGradient>
    <linearGradient id="bronzeTop" x1="0.15" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#4a3d31"/>
      <stop offset="0.28" stop-color="#7a6650"/>
      <stop offset="0.6" stop-color="#8b7660"/>
      <stop offset="1" stop-color="#5c4c3d"/>
    </linearGradient>
    <linearGradient id="bronzeSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3027"/>
      <stop offset="0.45" stop-color="#4a3d31"/>
      <stop offset="1" stop-color="#241d18"/>
    </linearGradient>
    <linearGradient id="insert" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e747a"/>
      <stop offset="0.18" stop-color="#c3c9cd"/>
      <stop offset="0.42" stop-color="#eef1f3"/>
      <stop offset="0.7" stop-color="#aab1b7"/>
      <stop offset="1" stop-color="#5d6368"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="524" cy="712" rx="362" ry="80" fill="url(#shadow)"/>

  <!-- right side face -->
  <path d="M730 410 L839 332 L839 632 L730 710 Z" fill="url(#bronzeSide)" stroke="#1a1512" stroke-width="2.5"/>
  <!-- cross-drilled relief slots through the side -->
  <g fill="#171310" stroke="#0f0c0a" stroke-width="2">
    <path d="M756 476 L826 426 L826 468 L756 518 Z"/>
    <path d="M756 556 L826 506 L826 548 L756 598 Z"/>
  </g>
  <g fill="none" stroke="#a08a70" stroke-opacity="0.35" stroke-width="2">
    <path d="M756 476 L826 426"/>
    <path d="M756 556 L826 506"/>
  </g>
  <!-- bead-blasted matte striation on side -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="3" fill="none">
    <path d="M736 690 L839 616"/>
    <path d="M736 650 L839 576"/>
    <path d="M736 430 L839 356"/>
  </g>

  <!-- top face -->
  <path d="M210 410 L730 410 L839 332 L319 332 Z" fill="url(#bronzeTop)" stroke="#1a1512" stroke-width="2.5"/>
  <!-- chamfer break inboard of the top edges -->
  <path d="M224 402 L727 402 L827 331 L322 331 Z" fill="none" stroke="#a89078" stroke-opacity="0.45" stroke-width="2.5"/>
