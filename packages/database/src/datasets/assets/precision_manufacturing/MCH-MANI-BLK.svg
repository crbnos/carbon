    <circle cx="300" cy="500" r="28" fill="url(#insert)" stroke="#4b5156" stroke-width="2"/>
    <circle cx="300" cy="500" r="16" fill="#12161a"/>
    <circle cx="300" cy="500" r="46" fill="none" stroke="#a08a70" stroke-opacity="0.35" stroke-width="2"/>

    <circle cx="452" cy="500" r="34" fill="#6a5844" opacity="0.55"/>
    <circle cx="452" cy="500" r="26" fill="#171310" stroke="#8b7660" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="452" cy="500" r="15" fill="#0f0c0a"/>

    <circle cx="604" cy="500" r="30" fill="#6a5844" opacity="0.55"/>
    <circle cx="604" cy="500" r="22" fill="#171310" stroke="#8b7660" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="604" cy="500" r="12" fill="#0f0c0a"/>

    <circle cx="300" cy="620" r="26" fill="#5c4c3d" opacity="0.5"/>
    <circle cx="300" cy="620" r="18" fill="#171310" stroke="#8b7660" stroke-opacity="0.4" stroke-width="2"/>

    <circle cx="452" cy="620" r="44" fill="#6a5844" opacity="0.6"/>
    <circle cx="452" cy="620" r="36" fill="none" stroke="#241d18" stroke-width="5"/>
    <circle cx="452" cy="620" r="36" fill="#2b231c"/>
    <circle cx="452" cy="620" r="26" fill="url(#insert)" stroke="#4b5156" stroke-width="2"/>
    <circle cx="452" cy="620" r="14" fill="#12161a"/>
    <circle cx="452" cy="620" r="44" fill="none" stroke="#a08a70" stroke-opacity="0.35" stroke-width="2"/>

    <circle cx="604" cy="620" r="26" fill="#5c4c3d" opacity="0.5"/>
    <circle cx="604" cy="620" r="18" fill="#171310" stroke="#8b7660" stroke-opacity="0.4" stroke-width="2"/>
