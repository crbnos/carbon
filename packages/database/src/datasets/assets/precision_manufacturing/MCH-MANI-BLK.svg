    <ellipse cx="477" cy="387" rx="19" ry="7.2" fill="#12161a"/>
    <ellipse cx="607" cy="387" rx="38" ry="14.4" fill="#6a5844" opacity="0.85"/>
    <ellipse cx="607" cy="387" rx="30" ry="11.4" fill="#241d18" stroke="#8b7660" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="607" cy="387" rx="19" ry="7.2" fill="#100d0b"/>
    <ellipse cx="390" cy="356" rx="30" ry="11.4" fill="#5c4c3d" opacity="0.8"/>
    <ellipse cx="390" cy="356" rx="22" ry="8.4" fill="#161210"/>
    <ellipse cx="520" cy="356" rx="46" ry="17.5" fill="#6a5844" opacity="0.85"/>
    <ellipse cx="520" cy="356" rx="37" ry="14.1" fill="#2b231c" stroke="#8b7660" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="520" cy="356" rx="27" ry="10.3" fill="url(#insert)" stroke="#4b5156" stroke-width="2"/>
    <ellipse cx="520" cy="356" rx="16" ry="6.1" fill="#12161a"/>
    <ellipse cx="650" cy="356" rx="30" ry="11.4" fill="#5c4c3d" opacity="0.8"/>
    <ellipse cx="650" cy="356" rx="22" ry="8.4" fill="#161210"/>
  </g>

  <!-- front face -->
  <path d="M210 410 L730 410 L730 710 L210 710 Z" fill="url(#bronzeFront)" stroke="#1a1512" stroke-width="3"/>
  <!-- uniform edge chamfers -->
  <g fill="none" stroke="#a08a70" stroke-opacity="0.4" stroke-width="2.5">
    <path d="M210 419 L730 419"/>
    <path d="M219 410 L219 710"/>
    <path d="M721 410 L721 710"/>
    <path d="M210 701 L730 701"/>
  </g>
  <!-- faint mill witness lines on the largest face -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" fill="none">
    <path d="M214 442 L726 442"/>
    <path d="M214 474 L726 474"/>
    <path d="M214 538 L726 538"/>
    <path d="M214 570 L726 570"/>
    <path d="M214 666 L726 666"/>
