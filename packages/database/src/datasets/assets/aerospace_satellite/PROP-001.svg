    <path d="M300 636 C250 636 222 656 210 686" stroke="url(#tiTube)" stroke-width="12"/>
    <path d="M300 630 C254 630 228 650 216 682" stroke="#ffffff" stroke-opacity="0.34" stroke-width="3.5"/>
    <path d="M724 636 C774 636 802 656 814 686" stroke="#5d6368" stroke-width="18"/>
    <path d="M724 636 C774 636 802 656 814 686" stroke="url(#tiTube)" stroke-width="12"/>
    <path d="M724 630 C770 630 796 650 808 682" stroke="#ffffff" stroke-opacity="0.34" stroke-width="3.5"/>
  </g>

  <!-- ===== two small thrusters, heat-tinted flared nozzles pointing outward ===== -->
  <!-- left thruster -->
  <g transform="translate(0 -70) rotate(-24 216 760)">
    <path d="M190 720 L242 720 L242 776 L190 776 Z" fill="url(#steelBarrel)" stroke="#5d6368" stroke-width="2.5"/>
    <ellipse cx="216" cy="720" rx="26" ry="10" fill="url(#steelFace)" stroke="#6a7076" stroke-width="2"/>
    <g stroke="#5d6368" stroke-width="2.5" opacity="0.6">
      <path d="M190 736 L242 732"/><path d="M190 750 L242 746"/><path d="M190 764 L242 760"/>
    </g>
    <path d="M190 776 L204 792 L228 792 L242 776 Z" fill="url(#steelBarrel)" stroke="#5d6368" stroke-width="2.5"/>
    <path d="M204 792 C198 820 172 838 146 860 A70 27 0 0 0 286 860 C260 838 234 820 228 792 Z"
