    <path d="M512 550 L512 590 C512 622 490 636 456 636 L300 636" stroke="#5d6368" stroke-width="20"/>
    <path d="M512 550 L512 590 C512 622 490 636 456 636 L300 636" stroke="url(#tiTube)" stroke-width="14"/>
    <path d="M512 556 L512 588 C512 616 492 630 456 630 L300 630" stroke="#ffffff" stroke-opacity="0.38" stroke-width="4"/>
    <path d="M512 590 C512 622 534 636 568 636 L724 636" stroke="#5d6368" stroke-width="20"/>
    <path d="M512 590 C512 622 534 636 568 636 L724 636" stroke="url(#tiTube)" stroke-width="14"/>
    <path d="M512 588 C512 616 532 630 568 630 L724 630" stroke="#ffffff" stroke-opacity="0.32" stroke-width="4"/>
  </g>

