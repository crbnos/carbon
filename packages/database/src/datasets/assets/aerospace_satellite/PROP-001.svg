    <path d="M796 792 C790 820 764 838 738 860 A70 27 0 0 0 878 860 C852 838 826 820 820 792 Z"
          fill="url(#heatTint)"/>
    <path d="M778 826 Q808 844 838 826" fill="none" stroke="#4a3a12" stroke-width="3" opacity="0.5"/>
    <ellipse cx="808" cy="860" rx="70" ry="27" fill="url(#bellBore)"/>
    <ellipse cx="808" cy="860" rx="70" ry="27" fill="none" stroke="#e8cd7c" stroke-width="3.5" opacity="0.8"/>
    <path d="M748 850 A62 24 0 0 1 868 850" fill="none" stroke="#8a6a2a" stroke-width="10" opacity="0.5"/>
    <ellipse cx="808" cy="852" rx="30" ry="11" fill="#191420"/>
  </g>
</svg>
