    <path d="M186 826 Q216 844 246 826" fill="none" stroke="#4a3a12" stroke-width="3" opacity="0.5"/>
    <ellipse cx="216" cy="860" rx="70" ry="27" fill="url(#bellBore)"/>
    <ellipse cx="216" cy="860" rx="70" ry="27" fill="none" stroke="#e8cd7c" stroke-width="3.5" opacity="0.8"/>
    <path d="M156 850 A62 24 0 0 1 276 850" fill="none" stroke="#8a6a2a" stroke-width="10" opacity="0.5"/>
    <ellipse cx="216" cy="852" rx="30" ry="11" fill="#191420"/>
  </g>
  <!-- right thruster -->
  <g transform="translate(0 -70) rotate(24 808 760)">
    <path d="M782 720 L834 720 L834 776 L782 776 Z" fill="url(#steelBarrel)" stroke="#5d6368" stroke-width="2.5"/>
    <ellipse cx="808" cy="720" rx="26" ry="10" fill="url(#steelFace)" stroke="#6a7076" stroke-width="2"/>
    <g stroke="#5d6368" stroke-width="2.5" opacity="0.6">
      <path d="M782 736 L834 732"/><path d="M782 750 L834 746"/><path d="M782 764 L834 760"/>
    </g>
    <path d="M782 776 L796 792 L820 792 L834 776 Z" fill="url(#steelBarrel)" stroke="#5d6368" stroke-width="2.5"/>
    <path d="M796 792 C790 820 764 838 738 860 A70 27 0 0 0 878 860 C852 838 826 820 820 792 Z"
