  <path d="M784 700 L868 640 L868 700 L784 760 Z" fill="url(#blkDark)" stroke="#0e1012" stroke-width="3"/>
  <path d="M240 712 L784 712" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <path d="M240 750 L784 750" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="3"/>

