  <g>
    <g fill="#8f979d" stroke="#5d6368" stroke-width="2">
      <polygon points="264,398 276,391 288,398 288,412 276,419 264,412"/>
      <polygon points="264,660 276,653 288,660 288,674 276,681 264,674"/>
      <polygon points="748,398 760,391 772,398 772,412 760,419 748,412"/>
      <polygon points="748,660 760,653 772,660 772,674 760,681 748,674"/>
      <polygon points="336,720 348,713 360,720 360,734 348,741 336,734"/>
      <polygon points="424,720 436,713 448,720 448,734 436,741 424,734"/>
      <polygon points="576,720 588,713 600,720 600,734 588,741 576,734"/>
      <polygon points="664,720 676,713 688,720 688,734 676,741 664,734"/>
      <polygon points="380,656 392,649 404,656 404,670 392,677 380,670"/>
      <polygon points="620,656 632,649 644,656 644,670 632,677 620,670"/>
    </g>
    <g fill="#eef1f3" opacity="0.45">
      <circle cx="276" cy="401" r="3.5"/><circle cx="276" cy="663" r="3.5"/>
      <circle cx="760" cy="401" r="3.5"/><circle cx="760" cy="663" r="3.5"/>
      <circle cx="348" cy="723" r="3.5"/><circle cx="436" cy="723" r="3.5"/>
      <circle cx="588" cy="723" r="3.5"/><circle cx="676" cy="723" r="3.5"/>
      <circle cx="392" cy="659" r="3.5"/><circle cx="632" cy="659" r="3.5"/>
    </g>
  </g>

