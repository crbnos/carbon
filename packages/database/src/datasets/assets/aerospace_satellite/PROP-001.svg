  <ellipse cx="512" cy="792" rx="400" ry="88" fill="url(#shadow)"/>

  <!-- ===== rear frame rail and rear posts (black anodised) ===== -->
  <path d="M324 300 L360 300 L360 636 L324 636 Z" fill="url(#blkDark)" stroke="#0e1012" stroke-width="2.5"/>
  <path d="M828 300 L864 300 L864 636 L828 636 Z" fill="url(#blkDark)" stroke="#0e1012" stroke-width="2.5"/>
  <path d="M324 300 L864 300 L864 336 L324 336 Z" fill="url(#blkDark)" stroke="#0e1012" stroke-width="2.5"/>
  <path d="M324 600 L864 600 L864 636 L324 636 Z" fill="url(#blkDark)" stroke="#0e1012" stroke-width="2.5"/>

  <!-- ===== plumbing that passes behind the tank ===== -->
  <g fill="none" stroke-linecap="round">
    <path d="M512 236 C512 190 560 168 640 176 L760 176 C806 176 820 206 820 250" stroke="#5d6368" stroke-width="22"/>
    <path d="M512 236 C512 190 560 168 640 176 L760 176 C806 176 820 206 820 250" stroke="url(#tiTube)" stroke-width="16"/>
    <path d="M508 232 C508 194 556 174 638 182" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4"/>
  </g>
  <!-- fill/drain valve on the top run -->
  <g>
    <path d="M796 240 L844 240 L844 300 L796 300 Z" fill="url(#steelBarrel)" stroke="#5d6368" stroke-width="2.5"/>
    <ellipse cx="820" cy="240" rx="24" ry="9" fill="url(#steelFace)" stroke="#6a7076" stroke-width="2"/>
    <ellipse cx="820" cy="240" rx="15" ry="5.7" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M796 264 L844 264 M796 278 L844 278" stroke="#5d6368" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- ===== spherical titanium propellant tank ===== -->
  <g>
    <circle cx="512" cy="392" r="166" fill="url(#tiBarrel)" stroke="#6b7278" stroke-width="3"/>
    <g clip-path="url(#tankClip)">
      <!-- girth weld seam -->
      <ellipse cx="512" cy="392" rx="166" ry="63" fill="none" stroke="#6b7278" stroke-width="5" opacity="0.55"/>
      <ellipse cx="512" cy="384" rx="166" ry="63" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
      <!-- satin spun texture following the hemisphere -->
      <g fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="3">
        <ellipse cx="512" cy="392" rx="166" ry="122"/>
        <ellipse cx="512" cy="392" rx="166" ry="24"/>
        <ellipse cx="512" cy="300" rx="140" ry="52"/>
        <ellipse cx="512" cy="482" rx="140" ry="52"/>
      </g>
      <g fill="none" stroke="#5f666c" stroke-opacity="0.2" stroke-width="3">
        <ellipse cx="512" cy="392" rx="166" ry="90"/>
        <ellipse cx="512" cy="322" rx="152" ry="60"/>
        <ellipse cx="512" cy="462" rx="152" ry="60"/>
      </g>
      <circle cx="512" cy="392" r="166" fill="url(#sphereLight)"/>
    </g>
    <!-- key-light glance -->
    <path d="M392 306 A166 166 0 0 1 486 240" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round"/>
