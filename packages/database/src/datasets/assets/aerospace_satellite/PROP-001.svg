    <ellipse cx="338" cy="542" rx="16" ry="6" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M312 570 L364 570 M312 584 L364 584 M312 598 L364 598" stroke="#5d6368" stroke-width="2.5" opacity="0.55"/>
    <path d="M320 556 L320 630" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M304 606 L372 606 L372 630 L304 630 Z" fill="url(#steelBarrel)" stroke="#5d6368" stroke-width="2"/>
    <!-- valve 2 -->
    <path d="M416 556 L468 556 L468 636 L416 636 Z" fill="url(#steelBarrel)" stroke="#5d6368" stroke-width="2.5"/>
    <ellipse cx="442" cy="556" rx="26" ry="10" fill="url(#steelFace)" stroke="#6a7076" stroke-width="2.5"/>
    <ellipse cx="442" cy="556" rx="16" ry="6" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M416 582 L468 582 M416 596 L468 596" stroke="#5d6368" stroke-width="2.5" opacity="0.55"/>
    <path d="M424 570 L424 630" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M408 610 L476 610 L476 630 L408 630 Z" fill="url(#steelBarrel)" stroke="#5d6368" stroke-width="2"/>
    <!-- valve 3 -->
    <path d="M556 556 L608 556 L608 636 L556 636 Z" fill="url(#steelBarrel)" stroke="#5d6368" stroke-width="2.5"/>
    <ellipse cx="582" cy="556" rx="26" ry="10" fill="url(#steelFace)" stroke="#6a7076" stroke-width="2.5"/>
    <ellipse cx="582" cy="556" rx="16" ry="6" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M556 582 L608 582 M556 596 L608 596" stroke="#5d6368" stroke-width="2.5" opacity="0.55"/>
    <path d="M564 570 L564 630" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M548 610 L616 610 L616 630 L548 630 Z" fill="url(#steelBarrel)" stroke="#5d6368" stroke-width="2"/>
    <!-- valve 4 -->
    <path d="M660 542 L712 542 L712 636 L660 636 Z" fill="url(#steelBarrel)" stroke="#5d6368" stroke-width="2.5"/>
    <ellipse cx="686" cy="542" rx="26" ry="10" fill="url(#steelFace)" stroke="#6a7076" stroke-width="2.5"/>
    <ellipse cx="686" cy="542" rx="16" ry="6" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M660 570 L712 570 M660 584 L712 584 M660 598 L712 598" stroke="#5d6368" stroke-width="2.5" opacity="0.55"/>
    <path d="M668 556 L668 630" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M652 606 L720 606 L720 630 L652 630 Z" fill="url(#steelBarrel)" stroke="#5d6368" stroke-width="2"/>
  </g>

  <!-- ===== swept tube runs out to the thrusters ===== -->
