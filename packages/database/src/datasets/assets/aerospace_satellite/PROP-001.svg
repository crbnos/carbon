  <path d="M240 380 L288 380 L288 700 L240 700 Z" fill="url(#blkBarrel)" stroke="#0e1012" stroke-width="3"/>
  <path d="M288 380 L324 344 L324 664 L288 700 Z" fill="url(#blkDark)" stroke="#0e1012" stroke-width="3"/>
  <path d="M240 380 L288 380 L324 344 L276 344 Z" fill="url(#blkFace)" stroke="#0e1012" stroke-width="3"/>
  <path d="M252 392 L252 690" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>

  <path d="M736 380 L784 380 L784 700 L736 700 Z" fill="url(#blkBarrel)" stroke="#0e1012" stroke-width="3"/>
  <path d="M784 380 L820 344 L820 664 L784 700 Z" fill="url(#blkDark)" stroke="#0e1012" stroke-width="3"/>
  <path d="M736 380 L784 380 L820 344 L772 344 Z" fill="url(#blkFace)" stroke="#0e1012" stroke-width="3"/>
  <path d="M748 392 L748 690" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>

