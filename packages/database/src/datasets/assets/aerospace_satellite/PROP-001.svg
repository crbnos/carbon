    <path d="M482 214 L482 250 L542 250 L542 214 Z" fill="url(#tiBarrel)" stroke="#6b7278" stroke-width="2.5"/>
    <ellipse cx="512" cy="214" rx="30" ry="11.4" fill="url(#tiFace)" stroke="#6b7278" stroke-width="2.5"/>
    <ellipse cx="512" cy="214" rx="19" ry="7.2" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2"/>
  </g>

  <!-- ===== ring cradle around the tank ===== -->
  <g>
    <!-- back half of the ring, above the tank equator -->
    <path d="M348 470 A164 62 0 0 1 676 470" fill="none" stroke="#0e1012" stroke-width="34"/>
    <path d="M348 470 A164 62 0 0 1 676 470" fill="none" stroke="#3f454a" stroke-width="27"/>
    <path d="M348 470 A164 62 0 0 1 676 470" fill="none" stroke="#5a6167" stroke-width="10" opacity="0.55"/>
    <!-- front half, in front of the tank -->
    <path d="M348 470 A164 62 0 0 0 676 470" fill="none" stroke="#0e1012" stroke-width="38"/>
    <path d="M348 470 A164 62 0 0 0 676 470" fill="none" stroke="url(#blkBarrel)" stroke-width="30"/>
    <path d="M356 484 A160 60 0 0 0 668 484" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="4"/>
    <!-- cradle clamp lugs -->
    <g>
      <path d="M336 452 L336 512 L372 512 L372 452 Z" fill="url(#blkFace)" stroke="#0e1012" stroke-width="2.5"/>
      <ellipse cx="354" cy="480" rx="9" ry="9" fill="#8f979d"/>
      <ellipse cx="354" cy="478" rx="5" ry="5" fill="#2a2e32"/>
      <path d="M652 452 L652 512 L688 512 L688 452 Z" fill="url(#blkFace)" stroke="#0e1012" stroke-width="2.5"/>
      <ellipse cx="670" cy="480" rx="9" ry="9" fill="#8f979d"/>
      <ellipse cx="670" cy="478" rx="5" ry="5" fill="#2a2e32"/>
    </g>
    <!-- cradle struts down to the deck -->
    <path d="M372 500 L390 500 L426 640 L404 640 Z" fill="url(#blkDark)" stroke="#0e1012" stroke-width="2.5"/>
    <path d="M652 500 L634 500 L598 640 L620 640 Z" fill="url(#blkDark)" stroke="#0e1012" stroke-width="2.5"/>
  </g>

  <!-- ===== feed line down from the tank to the manifold ===== -->
