<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6167"/>
      <stop offset="0.14" stop-color="#dfe6ea"/>
      <stop offset="0.34" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#9aa2a9"/>
      <stop offset="1" stop-color="#4e5459"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6167"/>
      <stop offset="0.14" stop-color="#dfe6ea"/>
      <stop offset="0.34" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#9aa2a9"/>
      <stop offset="1" stop-color="#4e5459"/>
    </linearGradient>
    <linearGradient id="chromeFace" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f4f8fa"/>
      <stop offset="0.45" stop-color="#cdd5da"/>
      <stop offset="1" stop-color="#7f878e"/>
    </linearGradient>
    <linearGradient id="hexHole" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#343a3f"/>
      <stop offset="1" stop-color="#697178"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="512" cy="836" rx="372" ry="82" fill="url(#shadow)"/>

  <!-- companion M5 screw lying flat beside it -->
  <g transform="translate(742 764) rotate(-7)">
    <path d="M-172 -42 L150 -42 L150 42 L-172 42 Z" fill="url(#chromeV)" stroke="#4a5055" stroke-width="2.5"/>
    <path d="M-172 -88 L-96 -88 L-96 88 L-172 88 Z" fill="url(#chromeV)" stroke="#4a5055" stroke-width="2.5"/>
    <g stroke="#7d848b" stroke-width="3.4" opacity="0.75" fill="none">
      <path d="M-88 -42 L-78 42 M-64 -42 L-54 42 M-40 -42 L-30 42 M-16 -42 L-6 42
               M8 -42 L18 42 M32 -42 L42 42 M56 -42 L66 42 M80 -42 L90 42
               M104 -42 L114 42 M128 -42 L138 42"/>
    </g>
    <g stroke="#ffffff" stroke-width="2" opacity="0.45" fill="none">
      <path d="M-80 -42 L-70 42 M-56 -42 L-46 42 M-32 -42 L-22 42 M-8 -42 L2 42
               M16 -42 L26 42 M40 -42 L50 42 M64 -42 L74 42 M88 -42 L98 42
               M112 -42 L122 42 M136 -42 L146 42"/>
    </g>
    <!-- flat cut end -->
    <ellipse cx="150" cy="0" rx="16" ry="42" fill="#c3cacf" stroke="#6b7278" stroke-width="2.5"/>
    <!-- head end face with narrow hex socket -->
    <ellipse cx="-172" cy="0" rx="30" ry="88" fill="url(#chromeFace)" stroke="#767d83" stroke-width="2.5"/>
    <g transform="translate(-172 0) scale(0.34 1)">
      <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="url(#hexHole)" stroke="#3f4549" stroke-width="5"/>
    </g>
    <path d="M-168 -62 L146 -62" stroke="#ffffff" stroke-opacity="0.28" stroke-width="7" fill="none"/>
  </g>

  <!-- main M5 x 16 screw standing upright on its head -->
  <g>
    <!-- head barrel -->
    <path d="M302 742 L302 806 Q430 904 558 806 L558 742 Z" fill="url(#chrome)" stroke="#454b50" stroke-width="3"/>
    <!-- fine knurl on the head circumference -->
    <g stroke="#5c6369" stroke-width="2.6" opacity="0.5" fill="none">
      <path d="M316 745 L316 800 M334 748 L334 810 M352 750 L352 818 M370 751 L370 824
