<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a9298"/>
      <stop offset="0.2" stop-color="#d5dce1"/>
      <stop offset="0.45" stop-color="#f0f4f6"/>
      <stop offset="0.72" stop-color="#b2bac0"/>
      <stop offset="1" stop-color="#798187"/>
    </linearGradient>
    <linearGradient id="clothDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b8288"/>
      <stop offset="0.2" stop-color="#bfc6cb"/>
      <stop offset="0.45" stop-color="#dae0e4"/>
      <stop offset="0.72" stop-color="#9ea6ac"/>
      <stop offset="1" stop-color="#6a7278"/>
    </linearGradient>
    <linearGradient id="elastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111315"/>
      <stop offset="0.25" stop-color="#2c3033"/>
      <stop offset="0.5" stop-color="#3b4044"/>
      <stop offset="0.75" stop-color="#212528"/>
      <stop offset="1" stop-color="#0d0f10"/>
    </linearGradient>
    <linearGradient id="cavity" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4d5459"/>
      <stop offset="1" stop-color="#22262a"/>
    </linearGradient>
    <linearGradient id="slider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6167"/>
      <stop offset="0.14" stop-color="#dfe6ea"/>
      <stop offset="0.34" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#9aa2a9"/>
      <stop offset="1" stop-color="#4e5459"/>
    </linearGradient>
    <pattern id="ripstop" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 0 L26 0 M0 0 L0 26" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>
      <path d="M13 0 L13 26 M0 13 L26 13" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
