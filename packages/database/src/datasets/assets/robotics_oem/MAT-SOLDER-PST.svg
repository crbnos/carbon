      <stop offset="0.2" stop-color="#e7eaec"/>
      <stop offset="0.45" stop-color="#f7f9fa"/>
      <stop offset="0.72" stop-color="#ced4d8"/>
      <stop offset="1" stop-color="#a4aaae"/>
    </linearGradient>
    <linearGradient id="hdpeTop" x1="0.2" y1="0" x2="0.85" y2="1">
