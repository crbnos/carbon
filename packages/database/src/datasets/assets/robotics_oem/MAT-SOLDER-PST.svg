  <ellipse cx="520" cy="682" rx="428" ry="94" fill="url(#shadow)"/>

  <!-- squat wide jar body -->
  <g>
    <path d="M152 410 L152 630 Q352 706 552 630 L552 410 Z" fill="url(#hdpe)" stroke="#8b9195" stroke-width="2.5"/>
