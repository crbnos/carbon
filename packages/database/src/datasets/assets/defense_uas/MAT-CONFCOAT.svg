      <stop offset="0.18" stop-color="#dfe3e5"/>
      <stop offset="0.42" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#c4c9cc"/>
      <stop offset="1" stop-color="#8a8f93"/>
    </linearGradient>
    <linearGradient id="greyPlastic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b4f52"/>
      <stop offset="0.22" stop-color="#787d81"/>
      <stop offset="0.45" stop-color="#8d9296"/>
      <stop offset="0.72" stop-color="#63686c"/>
      <stop offset="1" stop-color="#414548"/>
    </linearGradient>
    <linearGradient id="greyFace" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8d9296"/>
      <stop offset="0.4" stop-color="#787d81"/>
      <stop offset="0.75" stop-color="#5b6064"/>
      <stop offset="1" stop-color="#414548"/>
    </linearGradient>
    <linearGradient id="cupSteel" x1="0" y1="0" x2="1" y2="0">
