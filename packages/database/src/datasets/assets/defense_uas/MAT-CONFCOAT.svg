      <stop offset="0.16" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#dfe6ea" stop-opacity="0.22"/>
      <stop offset="0.74" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.40"/>
