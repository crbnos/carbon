      <stop offset="0.6" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bodyClip">
      <path d="M405 320 L405 790 A107 41 0 0 0 619 790 L619 320 Z"/>
    </clipPath>
