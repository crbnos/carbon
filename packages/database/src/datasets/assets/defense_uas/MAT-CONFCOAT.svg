  <path d="M400 300 L400 320 A112 43 0 0 0 624 320 L624 300 A112 43 0 0 1 400 300 Z" fill="url(#whiteBead)"/>
  <path d="M400 300 A112 43 0 0 0 624 300" fill="none" stroke="#8a8f93" stroke-width="2.5"/>
  <path d="M400 320 A112 43 0 0 0 624 320" fill="none" stroke="#82878b" stroke-width="2.5"/>
  <path d="M406 313 A112 43 0 0 0 618 313" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3"/>

  <!-- can body -->
  <path d="M405 320 L405 790 A107 41 0 0 0 619 790 L619 320 Z" fill="url(#whiteBarrel)"/>
  <g clip-path="url(#bodyClip)">
    <rect x="432" y="316" width="26" height="480" fill="#ffffff" opacity="0.5"/>
    <rect x="424" y="316" width="10" height="480" fill="#ffffff" opacity="0.25"/>
    <rect x="586" y="316" width="14" height="480" fill="#ffffff" opacity="0.12"/>
