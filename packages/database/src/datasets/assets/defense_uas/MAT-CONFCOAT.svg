  <path d="M400 770 A112 43 0 0 0 624 770" fill="none" stroke="#8a8f93" stroke-width="2.5"/>
  <path d="M400 800 A112 43 0 0 0 624 800" fill="none" stroke="#7b8084" stroke-width="3"/>
  <path d="M404 788 A112 43 0 0 0 620 788" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- clear plastic overcap, tilted against the base -->
  <g transform="rotate(-16 672 838)" opacity="0.95">
    <path d="M600 670 L600 825 A100 38 0 0 0 800 825 L800 670 Z" fill="url(#clearBarrel)"/>
    <path d="M600 670 L600 825 A100 38 0 0 0 800 825 L800 670" fill="none" stroke="#f2f6f8" stroke-opacity="0.8" stroke-width="3"/>
    <path d="M600 670 L600 825 A100 38 0 0 0 800 825 L800 670" fill="none" stroke="#7f868c" stroke-opacity="0.45" stroke-width="1.5"/>
    <ellipse cx="700" cy="670" rx="100" ry="38" fill="#ffffff" fill-opacity="0.16" stroke="#eef3f5" stroke-opacity="0.85" stroke-width="3"/>
    <ellipse cx="700" cy="670" rx="88" ry="33" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M600 812 A100 38 0 0 0 800 812" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <rect x="620" y="676" width="16" height="150" fill="#ffffff" opacity="0.35"/>
    <rect x="764" y="676" width="10" height="150" fill="#ffffff" opacity="0.22"/>
  </g>
  </g>
