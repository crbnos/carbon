  <ellipse cx="512" cy="176" rx="38" ry="14" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M450 176 L450 232 A62 24 0 0 0 574 232 L574 176" fill="none" stroke="#33373a" stroke-width="2.5"/>
  <!-- nozzle orifice on the front of the actuator -->
  <ellipse cx="470" cy="216" rx="19" ry="15" fill="#6e747a" stroke="#3a3e41" stroke-width="2"/>
  <ellipse cx="470" cy="216" rx="10" ry="8" fill="#22262a"/>
  <ellipse cx="468" cy="213" rx="4" ry="3" fill="#aab1b7" opacity="0.6"/>
  <path d="M458 196 L482 196" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" fill="none"/>

