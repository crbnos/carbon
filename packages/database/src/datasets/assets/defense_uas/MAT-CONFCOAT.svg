<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="whiteBarrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9aeb1"/>
      <stop offset="0.2" stop-color="#e4e8ea"/>
      <stop offset="0.45" stop-color="#fbfcfc"/>
      <stop offset="0.72" stop-color="#d2d6d9"/>
      <stop offset="1" stop-color="#9fa4a8"/>
    </linearGradient>
    <linearGradient id="whiteFace" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fbfcfc"/>
      <stop offset="0.45" stop-color="#e6eaec"/>
      <stop offset="0.78" stop-color="#c6cbce"/>
      <stop offset="1" stop-color="#a3a8ac"/>
    </linearGradient>
    <linearGradient id="whiteBead" x1="0" y1="0" x2="1" y2="0">
