    <rect x="234" y="700" width="32" height="82" fill="url(#enamel)"/>
    <ellipse cx="250" cy="782" rx="30" ry="12" fill="#4a4f54" stroke="#1e2124" stroke-width="2"/>
    <rect x="858" y="700" width="32" height="82" fill="url(#enamel)"/>
    <ellipse cx="874" cy="782" rx="30" ry="12" fill="#4a4f54" stroke="#1e2124" stroke-width="2"/>
  </g>

  <!-- cast iron bed plate -->
  <polygon points="132,760 826,760 910,700 216,700" fill="url(#castTop)" stroke="#2f3336" stroke-width="3"/>
  <polygon points="826,760 910,700 910,750 826,810" fill="url(#castSide)" stroke="#2f3336" stroke-width="3"/>
  <polygon points="132,760 826,760 826,810 132,810" fill="url(#castFront)" stroke="#2f3336" stroke-width="3"/>
  <polyline points="140,754 818,754 900,696" fill="none" stroke="#a2a7ab" stroke-width="2.5" opacity="0.45"/>
  <polyline points="138,804 820,804" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="3"/>

