<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="castTop" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4b4f52"/>
      <stop offset="0.22" stop-color="#787d81"/>
      <stop offset="0.45" stop-color="#8d9296"/>
      <stop offset="0.72" stop-color="#63686c"/>
      <stop offset="1" stop-color="#414548"/>
    </linearGradient>
    <linearGradient id="castFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b4f52"/>
      <stop offset="0.22" stop-color="#787d81"/>
      <stop offset="0.45" stop-color="#8d9296"/>
      <stop offset="0.72" stop-color="#63686c"/>
      <stop offset="1" stop-color="#414548"/>
    </linearGradient>
    <linearGradient id="castSide" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#63686c"/>
      <stop offset="0.6" stop-color="#4b4f52"/>
      <stop offset="1" stop-color="#383c3f"/>
