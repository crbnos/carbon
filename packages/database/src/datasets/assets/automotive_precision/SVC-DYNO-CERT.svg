    <path d="M196 700 L196 620 Q196 566 250 552 L310 552 Q364 566 364 620 L364 700 Z" fill="url(#enamelFace)" stroke="#1a1d20" stroke-width="3"/>
    <path d="M212 700 L212 622 Q212 588 246 578 L314 578 Q348 588 348 622 L348 700 Z" fill="#1e2124" opacity="0.55"/>
