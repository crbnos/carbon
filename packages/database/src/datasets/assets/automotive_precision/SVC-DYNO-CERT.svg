    <ellipse cx="167" cy="840" rx="32" ry="13" fill="#4a4f54" stroke="#1e2124" stroke-width="2"/>
    <rect x="772" y="806" width="34" height="34" fill="url(#enamel)"/>
    <ellipse cx="789" cy="840" rx="32" ry="13" fill="#4a4f54" stroke="#1e2124" stroke-width="2"/>
