    <rect x="436" y="524" width="24" height="152" fill="url(#brightBar)" stroke="#4b5156" stroke-width="2.5"/>
    <rect x="556" y="524" width="24" height="152" fill="url(#brightBar)" stroke="#4b5156" stroke-width="2.5"/>
