    <rect x="486" y="502" width="42" height="36" fill="#4a4f54" stroke="#1a1d20" stroke-width="2"/>
    <rect x="494" y="486" width="26" height="20" fill="#5e646a" stroke="#1a1d20" stroke-width="2"/>
