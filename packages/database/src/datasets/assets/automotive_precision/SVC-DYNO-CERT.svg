      <path d="M204 660 L204 696"/><path d="M356 660 L356 696"/>
    </g>
  </g>

  <!-- driveline shaft stub -->
  <rect x="330" y="588" width="118" height="44" fill="url(#brightBar)"/>
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="2">
    <path d="M340 598 L440 598"/><path d="M340 610 L440 610"/>
