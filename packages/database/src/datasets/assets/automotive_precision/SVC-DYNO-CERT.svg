      <ellipse cx="436" cy="655" rx="6" ry="9"/>
      <ellipse cx="443" cy="600" rx="6" ry="9"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="2" fill="none">
      <path d="M462 556 L554 556"/><path d="M462 578 L554 578"/><path d="M462 600 L554 600"/>
    </g>
