      <ellipse cx="730" cy="610" rx="47" ry="124" fill="url(#enamelFace)" stroke="#15181a" stroke-width="2.5"/>
      <ellipse cx="756" cy="610" rx="47" ry="124" fill="url(#enamelFace)" stroke="#15181a" stroke-width="2.5"/>
      <ellipse cx="782" cy="610" rx="47" ry="124" fill="url(#enamelFace)" stroke="#15181a" stroke-width="2.5"/>
      <ellipse cx="808" cy="610" rx="47" ry="124" fill="url(#enamelFace)" stroke="#15181a" stroke-width="2.5"/>
      <ellipse cx="834" cy="610" rx="47" ry="124" fill="url(#enamelFace)" stroke="#15181a" stroke-width="2.5"/>
      <ellipse cx="858" cy="610" rx="47" ry="124" fill="url(#enamelFace)" stroke="#15181a" stroke-width="2.5"/>
    </g>
    <ellipse cx="858" cy="610" rx="34" ry="90" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2.5"/>
    <ellipse cx="858" cy="610" rx="18" ry="48" fill="#33383d" stroke="#1a1d20" stroke-width="2"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2">
      <path d="M700 520 L866 520"/><path d="M700 700 L866 700"/>
    </g>
