  <!-- coiled sensor cable -->
  <g fill="none" stroke="url(#rubber)" stroke-width="16" stroke-linecap="round">
    <path d="M507 486 Q500 430 448 424 Q392 418 388 462 Q384 504 428 508 Q470 512 470 470"/>
