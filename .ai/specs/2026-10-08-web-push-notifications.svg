<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 552" width="800" height="552" role="img" aria-label="Sequence of messages between the browser, the push worker, the ERP routes, the pushSubscription table, the notify job, the send-push job and the push service, in three phases: enable, deliver, and sign out then sign in.">
<title>Browser push notifications: enable, deliver, sign out and sign in</title>
<style>
  :root { --panel: #ffffff; --ink: #262323; --faint: #6b6764; --hairline: #e3e2de; --accent: #1e84b0; }
  @media (prefers-color-scheme: dark) {
    :root { --panel: #1c1c1f; --ink: #ececea; --faint: #a3a19c; --hairline: #2e2e33; --accent: #5cc2ee; }
  }
  .box { fill: var(--panel); stroke: var(--hairline); stroke-width: 1.5; }
  .lane { fill: none; stroke: var(--hairline); stroke-dasharray: 4 4; }
  .edge { fill: none; stroke: var(--faint); stroke-width: 1.5; }
  .edge.hot { stroke: var(--accent); stroke-width: 2.5; }
  text { fill: var(--ink); font: 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  text.small { fill: var(--faint); font-size: 12px; }
  marker path { fill: var(--faint); }
  marker.hot path { fill: var(--accent); }
</style>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" /></marker>
          <marker id="arrow-hot" class="hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" /></marker>
        </defs>

        <!-- phase bands -->
        <rect class="lane" x="6" y="76" width="788" height="132" rx="10" />
        <rect class="lane" x="6" y="216" width="788" height="170" rx="10" />
        <rect class="lane" x="6" y="394" width="788" height="140" rx="10" />
        <text class="small" x="516" y="96">1 · Enable</text>
        <text class="small" x="70" y="236">2 · Deliver</text>
        <text class="small" x="516" y="414">3 · Sign out</text>
        <text class="small" x="516" y="430">and sign in</text>

        <!-- lifelines -->
        <path class="edge" stroke-dasharray="2 4" d="M60,64 L60,540" />
        <path class="edge" stroke-dasharray="2 4" d="M172,64 L172,540" />
        <path class="edge" stroke-dasharray="2 4" d="M284,64 L284,540" />
        <path class="edge" stroke-dasharray="2 4" d="M396,64 L396,540" />
        <path class="edge" stroke-dasharray="2 4" d="M508,64 L508,540" />
        <path class="edge" stroke-dasharray="2 4" d="M620,64 L620,540" />
        <path class="edge" stroke-dasharray="2 4" d="M732,64 L732,540" />

        <!-- participants -->
        <rect class="box" x="8" y="16" width="104" height="48" rx="8" />
        <text x="60" y="45" text-anchor="middle">Browser</text>
        <rect class="box" x="120" y="16" width="104" height="48" rx="8" />
        <text x="172" y="37" text-anchor="middle">Worker</text>
        <text class="small" x="172" y="55" text-anchor="middle">push-worker.js</text>
        <rect class="box" x="232" y="16" width="104" height="48" rx="8" />
        <text x="284" y="45" text-anchor="middle">ERP routes</text>
        <rect class="box" x="344" y="16" width="104" height="48" rx="8" />
        <text x="396" y="37" text-anchor="middle">Table</text>
        <text class="small" x="396" y="55" text-anchor="middle">pushSubscription</text>
        <rect class="box" x="456" y="16" width="104" height="48" rx="8" />
        <text x="508" y="45" text-anchor="middle">notify job</text>
        <rect class="box" x="568" y="16" width="104" height="48" rx="8" />
        <text x="620" y="45" text-anchor="middle">send-push job</text>
        <rect class="box" x="680" y="16" width="104" height="48" rx="8" />
        <text x="732" y="45" text-anchor="middle">Push service</text>

        <!-- 1 · Enable -->
        <text class="small" x="116" y="113" text-anchor="middle">Enable: register + subscribe</text>
        <path class="edge" d="M60,120 L170,120" marker-end="url(#arrow)" />
        <text class="small" x="172" y="148" text-anchor="middle">PUT subscription, gets carbon-push cookie</text>
        <path class="edge" d="M60,155 L282,155" marker-end="url(#arrow)" />
        <text class="small" x="340" y="183" text-anchor="middle">upsert the row of this endpoint</text>
        <path class="edge" d="M284,190 L394,190" marker-end="url(#arrow)" />

        <!-- 2 · Deliver -->
        <text class="small" x="452" y="253" text-anchor="middle">read rows of push recipients</text>
        <path class="edge" d="M508,260 L398,260" marker-end="url(#arrow)" />
        <text class="small" x="564" y="288" text-anchor="middle">carbon/send-push per row</text>
        <path class="edge" d="M508,295 L618,295" marker-end="url(#arrow)" />
        <text class="small" x="676" y="323" text-anchor="middle">signed, encrypted request</text>
        <path class="edge" d="M620,330 L730,330" marker-end="url(#arrow)" />
        <text class="small" x="452" y="358" text-anchor="middle">push event, worker shows it</text>
        <path class="edge" d="M732,365 L174,365" marker-end="url(#arrow)" />

        <!-- 3 · Sign out and sign in -->
        <text class="small" x="172" y="453" text-anchor="middle">sign out, cookie names the endpoint</text>
        <path class="edge" d="M60,460 L282,460" marker-end="url(#arrow)" />
        <text class="small" x="340" y="483" text-anchor="middle">delete rows of the endpoint</text>
        <path class="edge" d="M284,490 L394,490" marker-end="url(#arrow)" />
        <text class="small" x="172" y="513" text-anchor="middle">next sign-in, the bell re-saves the row</text>
        <path class="edge" d="M60,520 L282,520" marker-end="url(#arrow)" />
      
</svg>
