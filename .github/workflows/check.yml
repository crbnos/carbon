name: Check Lint and Types

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      # Turborepo's local cache, carried between runs: the postinstall
      # (fonts, MCP manifest), typecheck and test restore instead of re-running
      # for packages whose inputs did not change. Keyed per job so each job
      # saves its own tasks; it only ever grows, so bump the prefix to reset it.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-v1-${{ github.job }}-

      # Always install so the postinstall generates the gitignored font data.
      - run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      # Turborepo's local cache, carried between runs: the postinstall
      # (fonts, MCP manifest), typecheck and test restore instead of re-running
      # for packages whose inputs did not change. Keyed per job so each job
      # saves its own tasks; it only ever grows, so bump the prefix to reset it.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-v1-${{ github.job }}-

      # Always install so the postinstall generates the gitignored font data.
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome check

      - name: Conformance checks
        run: |
          pnpm --filter @carbon/config build
          pnpm --filter @carbon/checks exec vitest run src/run.test.ts

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      # Turborepo's local cache, carried between runs: the postinstall
      # (fonts, MCP manifest), typecheck and test restore instead of re-running
      # for packages whose inputs did not change. Keyed per job so each job
      # saves its own tasks; it only ever grows, so bump the prefix to reset it.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-v1-${{ github.job }}-

      # Always install so the postinstall generates the gitignored font data.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typegen
      - run: pnpm run typecheck

  lingui:
    name: Lingui
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      # Turborepo's local cache, carried between runs: the postinstall
      # (fonts, MCP manifest), typecheck and test restore instead of re-running
      # for packages whose inputs did not change. Keyed per job so each job
      # saves its own tasks; it only ever grows, so bump the prefix to reset it.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-v1-${{ github.job }}-

      # Always install so the postinstall generates the gitignored font data.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run lingui:check

  catalog:
    name: Catalog
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      # Turborepo's local cache, carried between runs: the postinstall
      # (fonts, MCP manifest), typecheck and test restore instead of re-running
      # for packages whose inputs did not change. Keyed per job so each job
      # saves its own tasks; it only ever grows, so bump the prefix to reset it.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-v1-${{ github.job }}-

      # Always install so the postinstall generates the gitignored font data.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run check:workflow-catalog

  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      # Turborepo's local cache, carried between runs: the postinstall
      # (fonts, MCP manifest), typecheck and test restore instead of re-running
      # for packages whose inputs did not change. Keyed per job so each job
      # saves its own tasks; it only ever grows, so bump the prefix to reset it.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-v1-${{ github.job }}-

      # Always install so the postinstall generates the gitignored font data.
      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job runs PR-authored code. actions/checkout otherwise leaves
          # GITHUB_TOKEN in .git/config, where a test could read and exfiltrate
          # it. Nothing here needs to talk to git after checkout.
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Each function is self-contained: it imports nothing from outside its
      # own directory, so this needs no permissions.
      - name: Self-contained
        working-directory: packages/database/supabase/functions
        run: |
          if grep -rnE "from ['\"]\.\./" --include='*.ts' .; then
            echo "Edge functions must not import from outside their own directory" >&2
            exit 1
          fi
      - name: Check
        working-directory: packages/database/supabase/functions
        run: deno check --no-lock */index.ts

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm audit --audit-level=critical || true
