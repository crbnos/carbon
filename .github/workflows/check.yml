name: Check Lint and Types

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      # Always install so the postinstall generates the gitignored font data.
      - run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      # Always install so the postinstall generates the gitignored font data.
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome check

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      # Always install so the postinstall generates the gitignored font data.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typegen
      - run: pnpm run typecheck

  lingui:
    name: Lingui
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      # Always install so the postinstall generates the gitignored font data.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run lingui:check

  catalog:
    name: Catalog
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      # Always install so the postinstall generates the gitignored font data.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run check:workflow-catalog

  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      # Always install so the postinstall generates the gitignored font data.
      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job runs PR-authored code. actions/checkout otherwise leaves
          # GITHUB_TOKEN in .git/config, where a test could read and exfiltrate
          # it. Nothing here needs to talk to git after checkout.
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          # Pin the major the functions are written against; the Supabase edge
          # runtime is Deno, so this suite needs Deno rather than Node/vitest.
          deno-version: v1.x

      # Runs with --no-check: `packages/database/tsconfig.json` only covers
      # `src` and `supabase/functions/lib/postgres/**`, so most of this tree is
      # not typechecked by tsgo either, and `deno check` currently reports 8
      # pre-existing errors (kysely/deno-postgres Pool typings + a TS2589).
      # Closing that gap is separate work — tracked in
      # .ai/plans/2026-09-09-accounting-nuclear-review-fixes.md.
      #
      # The regressions that need a real Postgres SKIP here (see `databaseTest`
      # in post-payment/payment-test-fixture.ts), so this run needs NO Deno
      # permissions at all — no env, net, read or write. `deno task test:db`
      # is the local variant that grants the four the pg driver needs.
      - name: Test
        working-directory: packages/database/supabase/functions
        run: deno task test

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm audit --audit-level=critical || true
