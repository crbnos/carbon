name: Post Deploy Sync

# What each workspace's freshly deployed ERP tells the services around it:
# Inngest its list of jobs, and a hosted Supabase project its Auth emails.
on:
  # Called by deploy.yml after a successful deploy.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Post Deploy Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Inngest functions and Auth emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm --filter ci ci:post-deploy
