name: Database types

# The committed database types (packages/database/src/types.ts and
# constants.ts) and the swagger schema (swagger-docs-schema.ts) must match the
# committed migrations. This applies every migration to an empty database,
# regenerates them and fails on a difference, so `crbn up` does not have to
# regenerate them on every boot. The Catalog and Lingui checks (check.yml)
# hold the workflow catalog and its labels to the committed swagger schema.
on:
  pull_request:
    branches: [main]
    paths:
      - "packages/database/supabase/migrations/**"
      - "packages/database/src/types.ts"
      - "packages/database/src/constants.ts"
      - "packages/database/src/swagger-docs-schema.ts"
      - "scripts/generate-db-types.ts"
      - "scripts/lib/generate-db-types.ts"
      - "scripts/generate-swagger-docs.ts"
      - "scripts/lib/swagger-schema.ts"
      - "packages/dev/docker/**"
      - "packages/dev/src/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/database-types.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    name: Database types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # This job runs the pull request's code, so the token is not left in
      # .git/config for it to read.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Restore only: Dependency cache (dependency-cache.yml) saves it on main.
      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-
      - run: pnpm install --frozen-lockfile

      # With CI set, `crbn migrate` boots only the shared Postgres and Storage,
      # GoTrue and Realtime, applies every migration to a fresh worktree
      # database, regenerates its types, then starts PostgREST and the gateway
      # for the swagger schema and leaves them running.
      - name: Migrate an empty database and regenerate the types and swagger
        env:
          CARBON_DEV_YES: "1"
          # The stack's name; otherwise taken from the checkout directory.
          CARBON_WORKTREE: ci-types
        run: packages/dev/bin/crbn migrate

      - name: Committed types and swagger match the migrations
        run: |
          files="packages/database/src/types.ts packages/database/src/constants.ts packages/database/src/swagger-docs-schema.ts"
          if ! git diff --quiet -- $files || [ -n "$(git ls-files --others -- $files)" ]; then
            git --no-pager diff --stat -- $files
            git --no-pager diff -- $files | head -200
            echo "::error::The committed database types or swagger schema do not match the migrations. Against a migrated database with the stack up (crbn up), run pnpm generate:types, pnpm generate:swagger, pnpm generate:workflow-catalog, then pnpm run lingui:extract && pnpm run lingui:clean, and commit what changed." >&2
            exit 1
          fi
