name: Deploy Apps

# Called by build-images.yml once this commit's carbon/erp and carbon/mes
# images are pushed. Run by hand, it deploys the images of the commit it is
# run on, which must already exist.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # One deploy at a time. A newer commit waiting replaces an older one that
    # had not started yet: it deploys the newer images anyway.
    concurrency:
      group: deploy-apps
      cancel-in-progress: false

    env:
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install compatible Pulumi version
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.212.0
          echo "$HOME/.pulumi/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deployment
        run: pnpm --filter ci ci:deploy

  # Inngest learns the new function list once the new tasks serve it.
  sync:
    name: Sync Inngest
    needs: deploy
    uses: ./.github/workflows/inngest.yml
    secrets: inherit
