name: Deploy Apps

on:
  push:
    branches:
      - main
    paths:
      - "apps/erp/**"
      - "apps/mes/**"
      - "packages/**"
      - "docs/content/**"
  workflow_dispatch:
jobs:
  # The images come from build-images.yml, which runs on the same push. This
  # waits for it rather than building them a second time.
  images:
    name: Wait for images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Wait for carbon/erp and carbon/mes
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          SHA: ${{ github.sha }}
        run: |
          [ -n "$REGISTRY" ] || { echo "vars.IMAGE_REGISTRY is not set" >&2; exit 1; }
          for app in erp mes; do
            until docker buildx imagetools inspect "$REGISTRY/carbon/$app:$SHA" >/dev/null 2>&1; do
              echo "waiting for $REGISTRY/carbon/$app:$SHA"
              sleep 15
            done
          done

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: images

    env:
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install compatible Pulumi version
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.212.0
          echo "$HOME/.pulumi/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deployment
        run: pnpm --filter ci ci:deploy
