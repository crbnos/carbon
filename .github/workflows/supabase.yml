name: Deploy Migrations
on:
  push:
    branches: [main]
    paths: ["packages/database/supabase/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # AWS role for the public.ecr.aws login below

jobs:
  supabase:
    name: Supabase Sync
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_REDIRECT_URI: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_REDIRECT_URI }}
      SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_SECRET }}
      SUPABASE_AUTH_EXTERNAL_AZURE_REDIRECT_URI: ${{ secrets.SUPABASE_AUTH_EXTERNAL_AZURE_REDIRECT_URI }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `supabase functions deploy` bundles inside the CLI's edge-runtime image,
      # pulled from public.ecr.aws. Never blocks a migration deploy.
      - if: vars.IMAGE_AWS_REGION != ''
        uses: aws-actions/configure-aws-credentials@v6
        continue-on-error: true
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.IMAGE_AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.IMAGE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.IMAGE_AWS_SECRET_ACCESS_KEY }}

      # Anonymous public.ecr.aws pulls share one data quota per runner IP and fail
      # with "toomanyrequests: Data limit exceeded"; authenticated pulls count against
      # the AWS account. Needs ecr-public:GetAuthorizationToken and
      # sts:GetServiceBearerToken; without them the pulls stay anonymous.
      - if: vars.IMAGE_AWS_REGION != ''
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: public.ecr.aws
        env:
          AWS_REGION: us-east-1

      - name: Run migrations
        run: pnpm --filter ci ci:migrations

      # NOTE: onboarding backup templates are NOT published here. They change
      # rarely and are large, so publishing is a deliberate, manual step run via
      # the "Publish backup templates" workflow (.github/workflows/publish-templates.yml)
      # or `pnpm --filter ci ci:upload-backup-templates` — never on every migration.
