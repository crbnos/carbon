name: Labeler

permissions:
  contents: read
  pull-requests: write

on:
  - pull_request

jobs:
  labeler:
    # Fork PRs get a read-only token and cannot set labels.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
