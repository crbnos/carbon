name: Build images

# Gives every commit on main the complete image set, tagged :<full sha>, so
# any commit can become a release. Images whose files did not change are
# re-tagged from the previous commit instead of rebuilt. Forks run this
# into their own registry.
#
# Configure vars.IMAGE_REGISTRY — any OCI registry, with an optional
# namespace: ghcr.io/acme, docker.io/acme, 123456789012.dkr.ecr.<region>.
# amazonaws.com. Unset, nothing runs. Then credentials for it:
#   GHCR  none; the workflow token pushes to this repository's packages
#   ECR   vars.IMAGE_AWS_REGION, and vars.IMAGE_AWS_ROLE_ARN (OIDC) or
#         secrets.IMAGE_AWS_ACCESS_KEY_ID + IMAGE_AWS_SECRET_ACCESS_KEY
#   other secrets.IMAGE_REGISTRY_USERNAME + IMAGE_REGISTRY_PASSWORD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ${{ vars.IMAGE_REGISTRY }}

jobs:
  # erp and mes are their own job so the deploy can need exactly them: a
  # failed assembler image does not hold back an app release, and the
  # assembler is its own job so its deploy needs only its image. Every image
  # job runs the same steps (the anchor below).
  apps:
    name: carbon/${{ matrix.image }}
    if: vars.IMAGE_REGISTRY != ''
    runs-on: ubuntu-24.04
    # Serial per image, so each run finds the previous commit's tag already
    # written. Per job rather than per workflow, so a deploy still running in
    # this run does not hold up the next commit's images.
    concurrency:
      group: build-images-${{ matrix.image }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        image: [erp, mes]
    steps: &image-steps
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - if: vars.IMAGE_AWS_REGION != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.IMAGE_AWS_REGION }}
          role-to-assume: ${{ vars.IMAGE_AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.IMAGE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.IMAGE_AWS_SECRET_ACCESS_KEY }}

      - id: host
        run: echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      # ECR logs in from the AWS credentials above when no password is given.
      - uses: docker/login-action@v4
        with:
          registry: ${{ steps.host.outputs.host }}
          username: ${{ secrets.IMAGE_REGISTRY_USERNAME || (steps.host.outputs.host == 'ghcr.io' && github.actor) || '' }}
          password: ${{ secrets.IMAGE_REGISTRY_PASSWORD || (steps.host.outputs.host == 'ghcr.io' && secrets.GITHUB_TOKEN) || '' }}

      # Anonymous public.ecr.aws pulls share one data quota per runner IP and fail
      # with "toomanyrequests: Data limit exceeded"; authenticated pulls count against
      # the AWS account. Needs ecr-public:GetAuthorizationToken and
      # sts:GetServiceBearerToken; without them the pulls stay anonymous.
      - if: vars.IMAGE_AWS_REGION != ''
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: public.ecr.aws
        env:
          AWS_REGION: us-east-1

      - id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The runner is thrown away after the job; removing the builder
          # on the way out only produces an error when something still
          # holds it.
          cleanup: false

      - id: plan
        run: .github/scripts/build-images.sh ${{ matrix.image }}
        env:
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}

      - if: steps.plan.outputs.action == 'retag'
        run: docker buildx imagetools create --tag "$IMAGE:$SHA" "$IMAGE:$FROM"
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          FROM: ${{ steps.plan.outputs.from }}
          SHA: ${{ github.sha }}

      # The assembler links a prebuilt OCCT base; built here only when this
      # registry does not have the one its sources describe.
      - if: steps.plan.outputs.occt_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: apps/assembler
          file: apps/assembler/occt.Dockerfile
          push: true
          tags: ${{ steps.plan.outputs.occt }}
          platforms: linux/amd64
          provenance: false

      - if: steps.plan.outputs.action == 'build'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.plan.outputs.file }}
          target: ${{ steps.plan.outputs.target }}
          build-args: ${{ steps.plan.outputs.args }}
          # source links a GHCR package to this repository, which is what
          # lets the workflow token keep pushing to it.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          tags: ${{ steps.plan.outputs.image }}:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          # No layer cache. An image is only built when its files changed,
          # which invalidates every layer after the base; exporting one took
          # about 95 seconds a build and one trivial layer was ever reused.

      # What was pushed, by digest, for the images job to collect. Carbon
      # reads that list from the run instead of reading the registry, so a
      # fork's registry needs no login of Carbon's.
      - id: digest
        run: |
          # A build says what it pushed. A re-tag is read back, and a public
          # ECR registry can take a while to serve a tag it just took.
          digest=$BUILT
          for wait in 0 5 10 15 30; do
            [ -n "$digest" ] && break
            sleep "$wait"
            digest=$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{.Manifest.Digest}}' || true)
          done
          if [ -z "$digest" ]; then
            echo "::error::$IMAGE:$SHA was pushed but its digest could not be read back"
            exit 1
          fi
          name=${IMAGE#"$REGISTRY"/}
          mkdir -p digest
          jq -n --arg name "$name" --arg digest "$digest" '{($name): $digest}' > digest/image.json
          echo "key=${name//\//-}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          SHA: ${{ github.sha }}
          BUILT: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.digest.outputs.key }}
          path: digest/image.json
          retention-days: 1
          # A re-run of this job replaces the digest it recorded.
          overwrite: true

  services:
    name: carbon/${{ matrix.image }}
    if: vars.IMAGE_REGISTRY != ''
    runs-on: ubuntu-24.04
    concurrency:
      group: build-images-${{ matrix.image }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        image: [bootstrap, edge-functions]
    steps: *image-steps

  assembler:
    name: carbon/assembler
    if: vars.IMAGE_REGISTRY != ''
    runs-on: ubuntu-24.04
    concurrency:
      group: build-images-${{ matrix.image }}
      cancel-in-progress: false
    strategy:
      matrix:
        image: [assembler]
    steps: *image-steps

  # Every image this commit has, by digest, as one artifact named
  # carbon-images: {"carbon/erp": "sha256:…", …}. Carbon makes the release
  # from it when the run finishes.
  images:
    name: Image digests
    needs: [apps, services, assembler]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
      - run: jq -s add digests/*/image.json > images.json
      - uses: actions/upload-artifact@v4
        with:
          name: carbon-images
          path: images.json
          overwrite: true

  # Whether this push changed anything the apps, or the assembler, are built
  # from. Runs beside the builds; a manual run of this workflow never deploys.
  changes:
    name: Deployable changes
    if: github.event_name == 'push' && vars.IMAGE_REGISTRY != ''
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
      assembler: ${{ steps.diff.outputs.assembler }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # A new branch or a force-push leaves no usable BEFORE: deploy.
          if [[ $BEFORE =~ ^0+$ ]] || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "assembler=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed() { ! git diff --quiet "$BEFORE" "$SHA" -- "$@"; }
          # The erp/mes inputs of .github/scripts/build-images.sh, plus the
          # docs the ERP bundles: a lockfile-only push rebuilds the images too.
          changed Dockerfile .dockerignore package.json pnpm-lock.yaml \
              pnpm-workspace.yaml .npmrc turbo.json lingui.config.js apps/erp \
              apps/mes packages patches scripts docs/content &&
            echo "deploy=true" >> "$GITHUB_OUTPUT" || echo "deploy=false" >> "$GITHUB_OUTPUT"
          # The assembler inputs of the same script.
          changed .dockerignore apps/assembler crates Cargo.toml Cargo.lock &&
            echo "assembler=true" >> "$GITHUB_OUTPUT" || echo "assembler=false" >> "$GITHUB_OUTPUT"

  # Starts only once carbon/erp and carbon/mes exist for this commit, and is
  # skipped outright when either failed or was cancelled — a dependency, not
  # a poll, so it can never sit waiting for images that will not come.
  # Carbon's own repository only: a fork has none of the deploy's secrets,
  # and a failed deploy fails the run its release is created from.
  deploy:
    name: Deploy
    needs: [apps, changes]
    if: github.repository == 'crbnos/carbon' && needs.changes.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      apps: true
    secrets: inherit

  # The same for carbon/assembler, deployed only when its files changed.
  deploy-assembler:
    name: Deploy assembler
    needs: [assembler, changes]
    if: github.repository == 'crbnos/carbon' && needs.changes.outputs.assembler == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      assembler: true
    secrets: inherit
