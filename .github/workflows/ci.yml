name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Volta
        run: curl https://get.volta.sh | bash
      - name: Export Volta PATH
        run: echo "$HOME/.volta/bin" >> $GITHUB_PATH
      - name: Use pinned toolchain
        run: |
          volta install node@20.16.0 npm@10.8.1
          node -v && npm -v
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build --workspaces --if-present
      - name: Lint (optional)
        run: npm run lint --workspaces --if-present
      - name: Typecheck (optional)
        run: npm run typecheck --workspaces --if-present
