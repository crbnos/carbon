name: Database tests

# The ERP's database tests (apps/erp/test/database) skip without a local
# database, so Checks' Test job, which has none, never runs them. This boots a
# migrated database and PostgREST and runs them, and fails if they cannot run.
#
# On every pull request that can change what they test: the ERP, any package
# it loads (the migrations among them) and the lockfile. A docs or MES-only
# pull request does not wait for them.
#
# Two runners each take half the test files (`vitest --shard`). The tests are
# bound by the runner's CPUs, which Postgres shares, so a second runner about
# halves the eight minutes they take; each pays the install and migration
# again.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/erp/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".nvmrc"
      - ".github/workflows/database-tests.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: Database tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # A failure in one half does not hide the other half's.
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CARBON_DEV_YES: "1"
      # The stack's name; otherwise taken from the checkout directory.
      CARBON_WORKTREE: ci-db
      # localhost URLs: portless asks for sudo to bind its proxy.
      CARBON_PORTLESS: "0"
    steps:
      # This job runs the pull request's code, so the token is not left in
      # .git/config for it to read.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Restore only: Dependency cache (dependency-cache.yml) saves it on
      # main, so the two shards never race to save one key.
      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            docs/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @carbon/config build

      # With CI set, boots only the shared Postgres and Storage, GoTrue and Realtime,
      # applies every migration to a fresh database, then starts PostgREST and
      # the gateway and returns once they answer, leaving them running. The
      # types and swagger are Database types' to check.
      - name: Migrate an empty database and start PostgREST
        run: packages/dev/bin/crbn migrate --no-regen

      # Without a local database the suite skips every test and passes, so
      # this fails the job instead.
      - name: The database and PostgREST answer
        run: |
          value() { grep -E "^$1=" .env.local | tail -1 | cut -d= -f2-; }
          db_url=$(value SUPABASE_DB_URL)
          port=$(value PORT_API)
          key=$(value SUPABASE_SERVICE_ROLE_KEY)
          if [ -z "$db_url" ] || [ -z "$port" ] || [ -z "$key" ]; then
            echo "::error::crbn did not write SUPABASE_DB_URL, PORT_API and SUPABASE_SERVICE_ROLE_KEY to .env.local" >&2
            exit 1
          fi
          case "$db_url" in
            postgresql://*@127.0.0.1:*|postgresql://*@localhost:*) ;;
            *)
              echo "::error::SUPABASE_DB_URL is not a local database: the tests would skip" >&2
              exit 1
              ;;
          esac
          migrations=$(psql "$db_url" -Atc 'SELECT count(*) FROM supabase_migrations.schema_migrations')
          if [ "${migrations:-0}" -eq 0 ]; then
            echo "::error::The database has no migrations applied" >&2
            exit 1
          fi
          # crbn waited for it; this holds the tests to the port they read.
          if ! curl -fsS -o /dev/null -H "apikey: $key" "http://localhost:$port/rest/v1/"; then
            echo "::error::PostgREST does not answer on http://localhost:$port/rest/v1/" >&2
            exit 1
          fi
          echo "$migrations migrations applied; PostgREST answers on port $port"
          echo "SUPABASE_DB_URL=$db_url" >> "$GITHUB_ENV"

      - name: Database tests
        working-directory: apps/erp
        run: |
          report="$RUNNER_TEMP/database-tests.json"
          pnpm exec vitest run test/database --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile="$report"
          # A run whose cases skipped passes too: hold it to having run them.
          REPORT="$report" node -e '
            const r = JSON.parse(require("node:fs").readFileSync(process.env.REPORT, "utf8"));
            console.log(`${r.numPassedTests} passed, ${r.numPendingTests} skipped`);
            if (r.numPassedTests === 0 || r.numPendingTests > r.numPassedTests / 10) {
              console.error("::error::The database tests skipped: they found no database or PostgREST");
              process.exit(1);
            }
          '
