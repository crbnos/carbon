# Dependabot configuration for automated dependency updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# One npm entry with directory "/" covers the whole pnpm workspace via the
# root pnpm-lock.yaml; one cargo entry likewise covers the Rust workspace via
# Cargo.lock. Updates are grouped to keep PR volume manageable in this monorepo.
# npm version updates are off; see the npm entry.
version: 2
updates:
  # JavaScript/TypeScript — pnpm workspace (root lockfile covers all packages/apps)
  # Version updates are off (limit 0). The workspace has ~340 direct
  # dependencies and Dependabot runs `pnpm update -r` for each, about 2.5 hours,
  # while a job is killed at 55 minutes. Every weekly run timed out, and a run
  # started by a change to this file blocked the release of that commit.
  # Vulnerable npm dependencies come from Dependabot security updates, which
  # run per advisory and are unaffected by this limit.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"

  # Rust — cargo workspace (root Cargo.lock covers all crates + assembler)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      cargo:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  # Docker base images
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/apps/assembler"
      - "/packages/database/supabase/edge-runtime"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Major image versions (a new Node or Postgres line) are upgraded on purpose,
    # not by a weekly bot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Images pinned in the dev and self-host compose files
  - package-ecosystem: "docker-compose"
    directories:
      - "/packages/dev/docker"
      - "/contrib/deploying/simple-docker-caddy"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Major image versions (a new Node or Postgres line) are upgraded on purpose,
    # not by a weekly bot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
